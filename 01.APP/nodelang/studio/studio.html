<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ArchHub</title>
<link rel="stylesheet" href="/assets/fonts.css"/><link rel="stylesheet" href="/studio/style.css"/>
</head><body><div id="root"></div><div id="studio-boot" role="status" data-boot-phase="cold"><div class="boot-card"><svg class="boot-mark" viewBox="0 0 64 64" width="48" height="48" aria-hidden="true"><path d="M10 56 V32 a22 22 0 0 1 44 0 V56" fill="none" stroke="#d97757" stroke-width="4.5" stroke-linecap="square"/><circle cx="32" cy="22" r="5.2" fill="#0e0e11" stroke="#d97757" stroke-width="2.4"/><circle cx="32" cy="22" r="1.8" fill="#d97757"/><path d="M6 58 H58" stroke="#d97757" stroke-width="1.5" stroke-linecap="round"/></svg><p class="boot-title">ArchHub</p><p class="boot-detail">Starting ArchHub</p><div class="boot-track" aria-hidden="true"><span class="boot-run"></span></div><div class="boot-actions" hidden><button type="button" class="boot-retry">Retry</button><button type="button" class="boot-receipts">See receipts</button></div><p class="boot-evidence" tabindex="-1" hidden></p></div></div>
<script>window.ARCHHUB_AUTHORITY = /*__ARCHHUB_AUTHORITY__*/ null; window.ARCHHUB_BOOT = /*__ARCHHUB_BOOT__*/ null;(function(){var phase='cold',detail='Starting ArchHub',saved=null;var asked=new URLSearchParams(location.search).get('boot');if(asked==='cold'||asked==='warm'||asked==='recovery'||asked==='error')phase=asked;else{try{saved=JSON.parse(sessionStorage.getItem('archhub.studio.session')||'null');}catch(e){saved=null;}if(saved&&saved.lastGraphId)phase='recovery';else if(saved)phase='warm';}if(phase==='warm')detail='Opening Home';if(phase==='recovery')detail='Restoring your last task';if(phase==='error')detail='ArchHub could not start';var boot=document.getElementById('studio-boot');boot.dataset.bootPhase=phase;if(asked)boot.dataset.hold='1';document.documentElement.dataset.start=phase==='cold'?'cold':'warm';boot.querySelector('.boot-detail').textContent=detail;if(phase==='error'){boot.setAttribute('role','alert');boot.querySelector('.boot-track').hidden=true;boot.querySelector('.boot-actions').hidden=false;}})();</script>
<script src="/studio/vendor/react.js"></script><script src="/studio/vendor/react-dom.js"></script><script src="/studio/studio-authority.js"></script>
<script>
(async () => {
 const boot=document.getElementById('studio-boot');
 return (async () => {
  const readAsset=async(name,limit)=>{
   const response=await fetch('/studio/'+name,{cache:'no-store',redirect:'error'});
   if(!response.ok||!response.body)throw Error('Studio build asset is missing.');
   const reader=response.body.getReader(),chunks=[];let size=0;
   try{for(;;){const {done,value}=await reader.read();if(done)break;size+=value.byteLength;if(size>limit){await reader.cancel();throw Error('Studio build asset exceeds its bound.');}chunks.push(value);}}finally{reader.releaseLock();}
   const bytes=new window.Uint8Array(size);let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.byteLength;}return bytes;
  };
  const hash=async bytes=>Array.from(new window.Uint8Array(await window.crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');
  const manifest=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(await readAsset('compiled/manifest.json',32768)));
  const css=await readAsset('style.css',1048576);
  if(await hash(css)!==manifest.inputs?.stylesheet?.sha256)throw Error('Studio stylesheet build is stale.');
  let sourceTotal=0,outputTotal=0,readyFailure;
  const names=["tokens.jsx", "ds/index.jsx", "api.js", "icons.jsx", "ui.jsx", "answer-widgets.jsx", "ds_home2.jsx", "ds_workshop3.jsx", "ds_screens.jsx", "ds_library.jsx", "ds_colleagues.jsx", "ds_baboom.jsx", "ds_settings3.jsx", "watcher-controls.jsx", "ds_watch_edit.jsx", "ds_firstrun.jsx", "surfaces.jsx", "integration-states.jsx", "project-tools.jsx", "community-tools.jsx", "agent-states.jsx", "research-surfaces.jsx", "dependencies.jsx", "workflow-states.jsx", "decision-results.jsx", "review-states.jsx", "canvas-states.jsx", "desktop.jsx", "meetings.jsx", "social.jsx", "research.jsx", "xray.jsx", "access.jsx", "account-tools.jsx", "routing.jsx", "brain.jsx", "docs.jsx", "companion.jsx", "context-menus.jsx", "app.jsx"];
  if(manifest.format!==1||manifest.files?.length!==names.length)throw Error('Studio build is invalid.');
  // Canvas engine (xyflow, pinned npm package bundled by the Studio build): loaded first, verified by SRI.
  for(const v of manifest.vendor||[]){
   if(!/^[a-z0-9][a-z0-9.-]*\.(js|css)$/.test(v.output)||!/^sha256-[A-Za-z0-9+/]{43}=$/.test(v.integrity))throw Error('Studio vendor bundle is invalid.');
   await new Promise((resolve,reject)=>{const css=v.output.endsWith('.css'),tag=document.createElement(css?'link':'script');
    if(css){tag.rel='stylesheet';tag.href='/studio/compiled/'+v.output;}else tag.src='/studio/compiled/'+v.output;
    tag.integrity=v.integrity;tag.crossOrigin='anonymous';tag.onload=resolve;tag.onerror=()=>reject(Error('Studio vendor bundle failed verification.'));
    if(css)document.head.insertBefore(tag,document.querySelector('link[href="/studio/style.css"]'));else document.body.appendChild(tag);});
  }
  for(let i=0;i<names.length;i++){
   const file=manifest.files[i];
   if(file.source!==names[i]||file.output!==names[i].replaceAll('/','-').replace(/\.jsx$/,'.js')||!/^sha256-[A-Za-z0-9+/]{43}=$/.test(file.integrity))throw Error('Studio build metadata changed.');
   if(!Number.isSafeInteger(file.source_bytes)||file.source_bytes<0||file.source_bytes>1048576||!Number.isSafeInteger(file.bytes)||file.bytes<1||file.bytes>2097152||!/^[a-f0-9]{64}$/.test(file.sha256))throw Error('Studio file bounds are invalid.');
   sourceTotal+=file.source_bytes;outputTotal+=file.bytes;
   if(sourceTotal>2097152||outputTotal>4194304)throw Error('Studio build exceeds its aggregate bound.');
   if(file.integrity!=='sha256-'+window.btoa(file.sha256.match(/../g).map(x=>String.fromCharCode(parseInt(x,16))).join('')))throw Error('Studio integrity metadata differs.');
  }
  await Promise.all(manifest.files.map(async file=>{
   const bytes=await readAsset(file.source,1048576);
   const sha=await hash(bytes);
   if(sha!==file.source_sha256||bytes.byteLength!==file.source_bytes)throw Error('Studio build is stale.');
  }));
  await Promise.all(manifest.files.map(file=>new Promise((resolve,reject)=>{
   const tag=document.createElement('script');tag.async=false;tag.src='/studio/compiled/'+file.output;
   tag.integrity=file.integrity;tag.crossOrigin='anonymous';tag.onerror=()=>reject(Error('Studio compiled asset failed verification.'));
   tag.onload=()=>{if(file.source==='api.js')window.ArchHubAPI.ready.catch(error=>{readyFailure=error;});resolve();};
   document.body.appendChild(tag);
  })));
  if(readyFailure)throw readyFailure;
  await window.ArchHubAPI.ready;
  if(boot.dataset.hold==='1')return;
  boot.remove();
 })().catch((bootFailure) => {
  document.body.prepend(boot);
  boot.dataset.bootPhase='error';
  boot.setAttribute('role','alert');
  boot.querySelector('.boot-detail').textContent='ArchHub could not start';
  const evidence=boot.querySelector('.boot-evidence');
  evidence.hidden=false;
  evidence.textContent=bootFailure.message || 'ArchHub could not start';
  boot.querySelector('.boot-track').hidden=true;
  boot.querySelector('.boot-actions').hidden=false;
  const retry=boot.querySelector('.boot-retry');
  retry.addEventListener('click',()=>{retry.disabled=true;window.location.reload();},{once:true});
  boot.querySelector('.boot-receipts').addEventListener('click',()=>{try{sessionStorage.setItem('archhub.startup.failure',evidence.textContent);}catch(storageFailure){evidence.textContent=storageFailure.message||'Startup evidence could not be stored.';}evidence.hidden=false;evidence.focus();},{once:true});
 });
})();
</script></body></html>
