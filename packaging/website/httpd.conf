# BusyBox httpd config for the ArchHub website image (packaging/website/Dockerfile).
#
# Without this, a missing URL returns the built-in httpd body
# ("<HTML><HEAD><TITLE>404 Not Found</TITLE>..."), which has no ArchHub design
# and no way back. E404 points httpd at the 404.html that nodelang.site_export
# writes into dist/ beside the exported pages.
#
# httpd refuses to serve its own httpd.conf, so shipping it inside the served
# directory does not expose it.
#
# BusyBox httpd has no redirect directive. The retired addresses of the old
# site (/docs/, /gallery/, /account/, /brain/ and the doc guides) are static
# redirect pages that nodelang.site_export writes into dist/.
#
# The built-in suffix table of BusyBox 1.35.0 (the httpd in
# lipanski/docker-static-website:2.1.0) types .html, .css, .png, .svg and .txt
# but not these suffixes the export writes: the favicon, the self-hosted fonts
# and the sitemap. Without a line httpd sends such a file with no Content-Type.
.ico:image/x-icon
.woff2:font/woff2
.xml:application/xml
E404:404.html
