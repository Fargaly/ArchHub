<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ArchHub — Founder Surface</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Architects+Daughter&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#0B0B0C;color:#ECE6DA;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:#F0DDD1;color:#A23E1F;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
</style>
</head>
<body>
<div id="root"></div>
<a href="/studio" style="position:fixed;left:10px;bottom:10px;z-index:99;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:#ECE6DA;background:#1a1a1cdd;border:1px solid #33322f;border-radius:5px;padding:5px 10px;text-decoration:none">← studio</a>
<script>
window.ARCHHUB_BOOT = /*__ARCHHUB_BOOT__*/ null;
(() => {
  const session = window.ARCHHUB_BOOT;
  // The wire inspector's rows are the server's one list (WIRE_PARAMETER_SPECS).
  // When they cannot be read, the panel says why instead of drawing nothing.
  window.WIRE_PARAMS = [];
  window.WIRE_PARAMS_ERROR = '';
  if (!session) {
    window.WIRE_PARAMS_ERROR = 'this page has no signed-in session';
    return;
  }
  window.ARCHHUB_SET_PROP = async (relation, value) => {
    const response = await fetch('/api/universal/set-property', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-ArchHub-Session': session.token,
        'X-ArchHub-CSRF': session.csrf,
      },
      credentials: 'same-origin',
      body: JSON.stringify({relation, value}),
    });
    const answer = await response.json();
    if (!response.ok || answer.ok === false) {
      throw new Error(answer.error || 'refused');
    }
    return answer;
  };
  window.ARCHHUB_WIRE_PARAMS_LOAD = fetch('/api/universal/node-library', {
    headers: {'X-ArchHub-Session': session.token, 'X-ArchHub-CSRF': session.csrf},
    credentials: 'same-origin',
  }).then(async response => {
    let answer = null;
    try { answer = await response.json(); } catch (_) { answer = null; }
    if (!response.ok || !answer || answer.ok === false) {
      throw new Error((answer && answer.error) || ('HTTP ' + response.status));
    }
    if (!Array.isArray(answer.wire_parameters) || !answer.wire_parameters.length) {
      throw new Error('the server listed no wire parameters');
    }
    window.WIRE_PARAMS = answer.wire_parameters;
    window.WIRE_PARAMS_ERROR = '';
  }).catch(error => {
    window.WIRE_PARAMS = [];
    window.WIRE_PARAMS_ERROR = (error && error.message) || String(error);
  });
})();
</script>
<script src="/studio/vendor/react.js"></script>
<script src="/studio/vendor/react-dom.js"></script>
<script src="/studio/vendor/babel.js"></script>
<script type="text/babel" data-presets="env,react" src="/studio/tokens.jsx"></script>
<!-- the shared parameter-type registry (types and sockets); the wire rows (window.WIRE_PARAMS) are served by /api/universal/node-library above -->
<script type="text/babel" data-presets="env,react" src="/studio/param-types.jsx"></script>
<script type="text/babel" data-presets="env,react" src="/studio/cockpit-core.jsx"></script>
<script type="text/babel" data-presets="env,react" src="/studio/hub-kit.jsx"></script>
<script src="/studio/map-data.js"></script>
<script type="text/babel" data-presets="env,react" src="/studio/atlas-engine.jsx"></script>
<script type="text/babel" data-presets="env,react" src="/studio/atlas-runtime.jsx"></script>
<script type="text/babel" data-presets="env,react" src="/studio/atlas-panels.jsx"></script>
<script type="text/babel" data-presets="env,react" src="/studio/atlas-side.jsx"></script>
<script type="text/babel" data-presets="env,react" src="/studio/atlas-cockpit.jsx"></script>
</body>
</html>
