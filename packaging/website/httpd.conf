# BusyBox httpd config for the ArchHub website image (packaging/website/Dockerfile).
#
# Without this, a missing URL returns the built-in httpd body
# ("<HTML><HEAD><TITLE>404 Not Found</TITLE>..."), which has no ArchHub design
# and no way back. E404 points httpd at the 404.html that nodelang.site_export
# writes into dist/ beside the exported pages.
#
# httpd refuses to serve its own httpd.conf, so shipping it inside the served
# directory does not expose it.
E404:404.html
