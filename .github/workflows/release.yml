          '@
          [IO.File]::WriteAllBytes($entry, [Convert]::FromBase64String($b64))
          # Without it the compiler defaults RUSTUP_HOME to a repo-relative folder with no toolchain.
          "RUSTUP_HOME=$(Join-Path $env:USERPROFILE '.rustup')" >> $env:GITHUB_ENV
      - name: Assign immutable build identity
        id: identity
        shell: pwsh
        run: |
          $stamp = [DateTime]::UtcNow.ToString('yyyyMMdd-HHmmss')
          $buildId = "$stamp-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-${{ steps.source.outputs.revision }}"
          "build_id=$buildId" >> $env:GITHUB_OUTPUT
      - name: Verify independent review and build the bundled runtime from pinned source
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = 'import sys,runpy;owner=runpy.run_path("selected/01.APP/nodelang/host_artifact_review.py");owner["load_review"](sys.argv[1],source_revision=sys.argv[2],bridges_root="selected/01.APP/bridges")'
          python -c $probe $env:BROKER_REVIEW_PATH $env:SOURCE_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'Independent broker review does not decide these source bytes.' }
          $build = Join-Path $env:RUNNER_TEMP 'goose-build'
          python selected/03.TOOLS/packaging/windows/build_goose.py --source (Join-Path $env:RUNNER_TEMP 'goose-src') --output $build --archhub-rev $env:SOURCE_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'Goose did not build from its pinned source.' }
          "GOOSE_BUILD_PATH=$build" >> $env:GITHUB_ENV
      - name: Compile Studio and installer from verified source snapshots
        shell: pwsh
        env:
          BUILD_ID: ${{ steps.identity.outputs.build_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'Visual Studio discovery is missing.' }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'The runner Visual Studio x64 toolchain was not found.' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) { throw 'The selected Visual Studio x64 setup is missing.' }
          # The compiler packager imports this checkout's x64 setup for both Cargo and dumpbin.
          $msvc = Join-Path $env:GITHUB_WORKSPACE 'selected/03.TOOLS/tools/archhub-compiler/target/msvc'
          New-Item -ItemType Directory -Force -Path $msvc | Out-Null
          Set-Content -LiteralPath (Join-Path $msvc 'setup_x64.bat') -Encoding ascii -Value @('@echo off', ('call "{0}"' -f $vcvars))
          ./selected/03.TOOLS/installer/build_release.ps1 `
            -BuildId $env:BUILD_ID `
            -GooseBuildPath $env:GOOSE_BUILD_PATH -BrokerReviewPath $env:BROKER_REVIEW_PATH `
            -OutputDirectory "$env:GITHUB_WORKSPACE/release-output"
      - name: Prove Office round-trips in the built Goose
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        working-directory: selected
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ARCHHUB_RELEASE_GOOSE_EXE = (Resolve-Path -LiteralPath (Join-Path $env:GOOSE_BUILD_PATH 'goose.exe')).ProviderPath
          python -B -m pytest -q -s 02.TESTS/tests_replica/test_goose_source.py::test_release_goose_office_round_trips
          if ($LASTEXITCODE -ne 0) { throw 'Office round-trips failed in the built Goose.' }
      - name: Prove installed users' updater accepts this build (dry run)
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        shell: pwsh
        run: |
          ./selected/03.TOOLS/packaging/windows/publish_release.ps1 `
            -ReleaseDirectory "$env:GITHUB_WORKSPACE/release-output" `
            -ExpectedSourceRevision '${{ steps.source.outputs.revision }}' -DryRun
      - name: Retain exact installer and metadata for review
        id: upload
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        uses: actions/upload-artifact@v7
        with:
          name: archhub-installer-${{ steps.identity.outputs.build_id }}
          path: |
            release-output/ArchHub-Setup-0.exe
            release-output/release.json
            release-output/release-notes.md
            release-output/source-manifest.tsv
            release-output/installed-source-manifest.tsv
            release-output/studio-build.json
            release-output/BUILD_METADATA.json
          if-no-files-found: error
          compression-level: 0
      - name: Prepare build-only artifact checksums
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'build' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath (Join-Path $env:GOOSE_BUILD_PATH 'goose.exe'), (Join-Path $env:GOOSE_BUILD_PATH 'receipt.json') -Destination release-output
          Copy-Item -LiteralPath (Join-Path $env:GOOSE_BUILD_PATH 'LICENSE') -Destination release-output/goose-LICENSE.txt
          foreach ($name in @('ArchHub-Setup-0.exe', 'goose.exe', 'receipt.json')) {
            $path = Join-Path release-output $name
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -LiteralPath "$path.sha256" -Encoding ascii
          }
      - name: Retain build-only installer, Goose and receipt
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: archhub-build-${{ steps.identity.outputs.build_id }}
          path: |
            release-output/ArchHub-Setup-0.exe
            release-output/ArchHub-Setup-0.exe.sha256
            release-output/goose.exe
            release-output/goose.exe.sha256
            release-output/receipt.json
            release-output/receipt.json.sha256
            release-output/goose-LICENSE.txt
          if-no-files-found: error
          compression-level: 0
      - name: Retain failed snapshot and partial build for inspection
        if: ${{ failure() && (github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) }}
        uses: actions/upload-artifact@v7
        with:
          name: archhub-failed-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-output/
          if-no-files-found: ignore
          compression-level: 0

  publish:
    needs: build
    if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the publish check at the built revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_revision }}
          path: selected
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the update parser's runtime
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r selected/requirements.txt
      - name: Download this run's exact build artifact
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-output
      - name: Verify and publish complete updater release
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_ID: ${{ needs.build.outputs.build_id }}
          SOURCE_REVISION: ${{ needs.build.outputs.source_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath release-output/release.json -Raw | ConvertFrom-Json
          if ($manifest.build_id -cne $env:BUILD_ID) { throw 'Downloaded artifact is not this run''s build.' }
          # One reconciliation and publish path for CI and local builds: bytes,
          # updater readability, newer than live latest, free tag, pushed source.
          ./selected/03.TOOLS/packaging/windows/publish_release.ps1 `
            -ReleaseDirectory release-output -ExpectedSourceRevision $env:SOURCE_REVISION `
            -Repository $env:GH_REPO


  verify-published:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-published' }}
    runs-on: windows-2025
    timeout-minutes: ${{ fromJSON(inputs.verify_minutes) }}
    permissions:
      contents: read
    env:
      PUBLISHED_REPOSITORY: Fargaly/ArchHub
      PUBLISHED_BUILD: 20261120-143339-44754205914-1-7c364326cfec80539087ac8153d5616322a78955
      PUBLISHED_SHA256: 62772163849761374db264a247e21bf3a50b7b170986f224cfff5f0f421bfeb6
      PUBLISHED_BYTES: '416586952'
      VERIFY_MINUTES: ${{ inputs.verify_minutes }}
    steps:
      - name: Check out the verification tools only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: selected
          persist-credentials: false
      - name: Prepare failure evidence for all six Settings cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'archhub-verify-published'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          "VERIFY_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          $source = Get-Content -Raw selected/03.TOOLS/tools/real_app_check/scenarios/settings.mjs
          $block = [regex]::Match($source, '(?s)export const steps=\[(.*?)\];').Groups[1].Value
          $names = @([regex]::Matches($block, "'([^']+)'") | ForEach-Object { $_.Groups[1].Value })
          if ($names.Count -ne 6) { throw 'The Settings scenario must declare exactly six cases.' }
          $names | ConvertTo-Json | Set-Content (Join-Path $evidence 'declared-settings.json') -Encoding utf8
          @{repository=$env:PUBLISHED_REPOSITORY;build=$env:PUBLISHED_BUILD;workflow_source=$env:GITHUB_SHA;setup_verified=$false;setup_sha256=$null;setup_bytes=$null;install_exit=$null;installed_root=$null;installed_build=$null;first_run_python=$null;first_run_python_version=$null;first_run_exit=$null;ui_exit=$null} |
            ConvertTo-Json | Set-Content (Join-Path $evidence 'install.json') -Encoding utf8
          if (@('15', '20', '25', '30') -cnotcontains $env:VERIFY_MINUTES) { throw 'Choose a supported verification budget.' }
      - name: Verify and install the exact published Setup for this clean user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:VERIFY_EVIDENCE 'install.json'
          $state = Get-Content -Raw $receipt | ConvertFrom-Json
          $setup = Join-Path $env:RUNNER_TEMP 'ArchHub-Setup-0.exe'
          $tag = 'build-' + $env:PUBLISHED_BUILD
          $url = 'https://github.com/' + $env:PUBLISHED_REPOSITORY + '/releases/download/' + $tag + '/ArchHub-Setup-0.exe'
          Invoke-WebRequest -Uri $url -OutFile $setup
          $bytes = (Get-Item -LiteralPath $setup).Length
          $digest = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bytes -ne [long]$env:PUBLISHED_BYTES -or $digest -cne $env:PUBLISHED_SHA256) { throw 'Published Setup identity differs; nothing was executed.' }
          $state.setup_verified = $true
          $state.setup_sha256 = $digest
          $state.setup_bytes = $bytes
          $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
          $log = Join-Path $env:VERIFY_EVIDENCE 'setup.log'
          $process = Start-Process -FilePath $setup -ArgumentList @('/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/RESTARTEXITCODE=3010', '/TASKS="desktopicon"', ('/LOG="' + $log + '"')) -WindowStyle Hidden -PassThru -Wait
          $state.install_exit = $process.ExitCode
          $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
          if ($process.ExitCode -ne 0) { throw ('Native Setup failed or requires restart: ' + $process.ExitCode) }
          $app = Join-Path $env:LOCALAPPDATA 'ArchHub'
          $state.installed_root = $app
          $state.installed_build = (Get-Content -Raw (Join-Path $app 'BUILD_ID')).Trim()
          $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
          if ($state.installed_build -cne $env:PUBLISHED_BUILD) { throw 'The default installed build differs from the pinned release.' }
      - name: Run the installed first-run setup and six actual-window Settings cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:VERIFY_EVIDENCE 'install.json'
          $state = Get-Content -Raw $receipt | ConvertFrom-Json
          $app = Join-Path $env:LOCALAPPDATA 'ArchHub'
          # Reuse the installed launcher's exact interpreter discovery without starting its updater or UI.
          $launcher = Get-Content -Raw (Join-Path $app 'ArchHub.vbs')
          $discovery = [regex]::Match($launcher, '(?is)Function FindPython\(kind\).*?End Function\s+Function PythonUsable\(candidate\).*?End Function').Value
          $quoting = [regex]::Match($launcher, '(?is)Function QuoteArgument\(value\).*?End Function').Value
          if (-not $discovery -or -not $quoting) { throw 'Installed launcher interpreter discovery or its quoting helper is unavailable.' }
          $probe = Join-Path $env:VERIFY_EVIDENCE 'launcher-python.vbs'
          $prefix = 'Set sh = CreateObject("WScript.Shell")' + "`r`n" + 'Set fso = CreateObject("Scripting.FileSystemObject")' + "`r`n"
          [IO.File]::WriteAllText($probe, $prefix + $quoting + "`r`n" + $discovery + "`r`n" + 'WScript.Echo FindPython("python")', [Text.UTF8Encoding]::new($false))
          $python = (& (Join-Path $env:WINDIR 'System32/cscript.exe') //nologo $probe | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($python) -or -not [IO.Path]::IsPathFullyQualified($python) -or -not (Test-Path -LiteralPath $python)) { throw 'Installed launcher found no usable absolute Python.' }
          $state.first_run_python = $python
          $state.first_run_python_version = (& $python -E -s -c 'import sys; print(sys.version); raise SystemExit(0 if sys.version_info[:2] == (3,14) else 1)' | Out-String).Trim()
          $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Installed launcher Python does not support the bundled wheelhouse.' }
          & $python -E -s -B (Join-Path $app 'colleague_setup.py') --launcher-setup 2>&1 | Tee-Object -FilePath (Join-Path $env:VERIFY_EVIDENCE 'first-run.log')
          $state.first_run_exit = $LASTEXITCODE
          $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
          if ($state.first_run_exit -ne 0) { throw 'The installed first-run setup did not finish.' }
          $env:PATH = (Join-Path $app 'runtime') + [IO.Path]::PathSeparator + $env:PATH
          & (Join-Path $app '.venv/Scripts/python.exe') -B selected/03.TOOLS/tools/real_app_check/real_app_check.py --app $app --scenario selected/03.TOOLS/tools/real_app_check/scenarios/settings.mjs --out (Join-Path $env:VERIFY_EVIDENCE 'settings') --boot-seconds 600 --probe-seconds 300
          $state.ui_exit = $LASTEXITCODE
          $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
          if ($state.ui_exit -ne 0) { throw 'Installed Settings actual-window acceptance failed; inspect the retained report.' }
      - name: Record each Settings outcome even when install or launch failed
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'archhub-verify-published'
          $declared = Join-Path $evidence 'declared-settings.json'
          if (-not (Test-Path -LiteralPath $declared)) { throw 'Verification initialization did not produce declared Settings evidence.' }
          $stepsFile = Join-Path $evidence 'settings/steps.json'
          $actual = @()
          if (Test-Path -LiteralPath $stepsFile) { $actual = @(Get-Content -Raw $stepsFile | ConvertFrom-Json) }
          $rows = @(Get-Content -Raw $declared | ConvertFrom-Json | ForEach-Object {
            $asked = $_
            $found = @($actual | Where-Object { $_.asked -ceq $asked })
            if ($found.Count -eq 1) { $found[0] }
            else { @{asked=$asked;result='NOT EXERCISED';did='Install or actual-window check did not reach this case; no pass claimed.'} }
          })
          $rows | ConvertTo-Json -Depth 12 | Set-Content (Join-Path $evidence 'settings-results.json') -Encoding utf8
      - name: Retain install identity, actual window and all six outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archhub-verify-published-7c-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/archhub-verify-published/install.json
            ${{ runner.temp }}/archhub-verify-published/setup.log
            ${{ runner.temp }}/archhub-verify-published/first-run.log
            ${{ runner.temp }}/archhub-verify-published/settings-results.json
            ${{ runner.temp }}/archhub-verify-published/settings/report.json
            ${{ runner.temp }}/archhub-verify-published/settings/steps.json
            ${{ runner.temp }}/archhub-verify-published/settings/*.png
