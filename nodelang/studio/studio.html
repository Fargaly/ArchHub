<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ArchHub</title>
<link rel="stylesheet" href="/assets/fonts.css"/><link rel="stylesheet" href="/studio/style.css"/>
</head><body><div id="root"></div><div id="studio-boot" role="status">Connecting to ArchHub…</div>
<script>window.ARCHHUB_AUTHORITY = /*__ARCHHUB_AUTHORITY__*/ null; window.ARCHHUB_BOOT = /*__ARCHHUB_BOOT__*/ null;</script>
<script src="/studio/vendor/react.js"></script><script src="/studio/vendor/react-dom.js"></script><script src="/studio/studio-authority.js"></script>
<script>
(async () => {
 const boot=document.getElementById('studio-boot');
 return (async () => {
  const readAsset=async(name,limit)=>{
   const response=await fetch('/studio/'+name,{cache:'no-store',redirect:'error'});
   if(!response.ok||!response.body)throw Error('Studio build asset is missing.');
   const reader=response.body.getReader(),chunks=[];let size=0;
   try{for(;;){const {done,value}=await reader.read();if(done)break;size+=value.byteLength;if(size>limit){await reader.cancel();throw Error('Studio build asset exceeds its bound.');}chunks.push(value);}}finally{reader.releaseLock();}
   const bytes=new window.Uint8Array(size);let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.byteLength;}return bytes;
  };
  const hash=async bytes=>Array.from(new window.Uint8Array(await window.crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');
  const manifest=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(await readAsset('compiled/manifest.json',32768)));
  const css=await readAsset('style.css',1048576);
  if(await hash(css)!==manifest.inputs?.stylesheet?.sha256)throw Error('Studio stylesheet build is stale.');
  let sourceTotal=0,outputTotal=0;
  const names=["tokens.jsx", "ds/index.jsx", "api.js", "icons.jsx", "ui.jsx", "answer-widgets.jsx", "ds_home2.jsx", "ds_workshop3.jsx", "ds_screens.jsx", "ds_library.jsx", "ds_colleagues.jsx", "ds_baboom.jsx", "ds_settings3.jsx", "watcher-controls.jsx", "ds_watch_edit.jsx", "ds_firstrun.jsx", "surfaces.jsx", "integration-states.jsx", "project-tools.jsx", "community-tools.jsx", "agent-states.jsx", "research-surfaces.jsx", "dependencies.jsx", "workflow-states.jsx", "decision-results.jsx", "review-states.jsx", "canvas-states.jsx", "desktop.jsx", "meetings.jsx", "social.jsx", "research.jsx", "xray.jsx", "access.jsx", "account-tools.jsx", "routing.jsx", "brain.jsx", "docs.jsx", "companion.jsx", "context-menus.jsx", "app.jsx"];
  if(manifest.format!==1||manifest.files?.length!==names.length)throw Error('Studio build is invalid.');
  for(let i=0;i<names.length;i++){
   const file=manifest.files[i];
   if(file.source!==names[i]||file.output!==names[i].replaceAll('/','-').replace(/\.jsx$/,'.js')||!/^sha256-[A-Za-z0-9+/]{43}=$/.test(file.integrity))throw Error('Studio build metadata changed.');
   if(!Number.isSafeInteger(file.source_bytes)||file.source_bytes<0||file.source_bytes>1048576||!Number.isSafeInteger(file.bytes)||file.bytes<1||file.bytes>2097152||!/^[a-f0-9]{64}$/.test(file.sha256))throw Error('Studio file bounds are invalid.');
   sourceTotal+=file.source_bytes;outputTotal+=file.bytes;
   if(sourceTotal>2097152||outputTotal>4194304)throw Error('Studio build exceeds its aggregate bound.');
   if(file.integrity!=='sha256-'+window.btoa(file.sha256.match(/../g).map(x=>String.fromCharCode(parseInt(x,16))).join('')))throw Error('Studio integrity metadata differs.');
   const bytes=await readAsset(file.source,1048576);
   const sha=await hash(bytes);
   if(sha!==file.source_sha256||bytes.byteLength!==file.source_bytes)throw Error('Studio build is stale.');
   await new Promise((resolve,reject)=>{const tag=document.createElement('script');tag.src='/studio/compiled/'+file.output;tag.integrity=file.integrity;tag.crossOrigin='anonymous';tag.onload=resolve;tag.onerror=()=>reject(Error('Studio compiled asset failed verification.'));document.body.appendChild(tag);});
   if(file.source==='api.js')await window.ArchHubAPI.ready;
  }
  boot.remove();
 })().catch((bootFailure) => {
  boot.setAttribute('role','alert');
  const message=document.createElement('p');
  message.textContent=bootFailure.message || 'Could not open ArchHub.';
  const retry=document.createElement('button');
  retry.type='button';retry.textContent='Retry opening ArchHub';
  retry.addEventListener('click',()=>{retry.disabled=true;window.location.reload();},{once:true});
  boot.replaceChildren(message,retry);
 });
})();
</script></body></html>
