<style>
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#0B0B0C;color:#ECE6DA;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:#F0DDD1;color:#A23E1F;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
</style>

<body>
<div id="root"></div>
<a href="/studio" style="position:fixed;left:10px;bottom:10px;z-index:99;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:#ECE6DA;background:#1a1a1cdd;border:1px solid #33322f;border-radius:5px;padding:5px 10px;text-decoration:none">← studio</a>
<script>
window.ARCHHUB_BOOT = /*__ARCHHUB_BOOT__*/ null;
(() => {
  const session = window.ARCHHUB_BOOT;
  if (!session) return;
  window.ARCHHUB_SET_PROP = async (relation, value) => {
    const response = await fetch('/api/universal/set-property', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-ArchHub-Session': session.token,
        'X-ArchHub-CSRF': session.csrf,
      },
      credentials: 'same-origin',
      body: JSON.stringify({relation, value}),
    });
    const answer = await response.json();
    if (!response.ok || answer.ok === false) {
      throw new Error(answer.error || 'refused');
    }
    return answer;
  };
})();
</script>
<script src="/studio/vendor/react.js"></script>
