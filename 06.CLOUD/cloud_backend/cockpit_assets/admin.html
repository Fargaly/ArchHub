<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ArchHub Cockpit</title>
<!-- The Founder Cockpit: the admin panel that runs ArchHub (founder 2026-11-17). Served only at /founder behind
     require_founder; never linked from the shipped app or any public page.
     Design read: the founder's admin console (people, money, community, voice, operations), dense and calm, on the
     frozen v53 tokens of prototype 35.08 app-011. Every list is read from a /founder/api route and every control
     calls one; nothing on this page is sample data. -->
<style>
/* the two faces of the prototype, served by this server (byte copies of 01.APP/nodelang/data/website/fonts); no font CDN */
@font-face{font-family:"Inter";src:url("/founder/map-assets/fonts/inter-variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("/founder/map-assets/fonts/jetbrains-mono-regular.woff2") format("woff2");font-weight:400;font-display:swap}
:root{color-scheme:dark;
 --bg:#0e0e11; --bgDeep:#0a0a0d; --bgPanel:#15151a; --bgSoft:#1c1c23; --bgRaised:#1d1d22; --bgHover:#22222a;
 --line:#26262e; --lineSoft:#1e1e24; --lineHair:#1a1a20; --ink:#ece8e0; --ink2:#9b938a; --ink3:#8b837a;
 --onFill:#180f08; --accent:#d97757; --accentHi:#e8896a; --accentSoft:#3a2018;
 --ok:#7ec18e; --warn:#e5b25a; --err:#e6705f; --cyan:#5fb3b3; --blue:#7898d6;
 --f-ui:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
 --r:6px; --t-fast:120ms; --t-med:180ms; --ease:cubic-bezier(.2,0,0,1); --ease-out:cubic-bezier(.16,1,.3,1);
 --e2:inset 0 1px 0 rgba(255,255,255,.05),0 8px 24px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);background:var(--bg);color:var(--ink);font:13px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink2)}.dim{color:var(--ink3)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
/* header */
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;border-bottom:1px solid var(--lineHair);min-width:0}
.mark{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.mark i{width:22px;height:22px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:var(--onFill);font-style:normal;font-weight:700;font-size:12px}
.crumb{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.local{display:none;align-items:center;height:20px;padding:0 7px;border:1px dashed #4a4033;border-radius:10px;color:var(--warn);font-size:11px;font-weight:500;white-space:nowrap}
.local.on{display:inline-flex}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:30px;width:min(360px,34vw);padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bgPanel);color:var(--ink3);white-space:nowrap;overflow:hidden}
.search:hover{border-color:#34343e;color:var(--ink2)}
.search kbd{margin-left:auto;font:11px var(--f-mono);color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bgPanel);white-space:nowrap}
.hbtn:hover{background:var(--bgHover)}
.hbtn.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.acct{width:28px;height:28px;border-radius:50%;background:#d8c5a8;color:#5a4a2a;display:grid;place-items:center;flex:none}
/* sidebar */
nav.side{grid-row:2;border-right:1px solid var(--lineHair);overflow-y:auto;padding:10px 8px 16px}
.grp{margin:12px 8px 4px;color:var(--ink3);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.grp:first-child{margin-top:2px}
.nv{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:var(--r);color:var(--ink2);text-align:left;transition:background var(--t-fast) var(--ease),color var(--t-fast)}
.nv:hover{background:var(--bgSoft);color:var(--ink)}
.nv.on{background:var(--accentSoft);color:var(--ink)}
.nv.on svg{color:var(--accentHi)}
.nv span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv b{font:500 11px var(--f-mono);color:var(--ink3)}
.nv b.hot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--onFill);display:grid;place-items:center}
@media (max-width:1000px){.nv{height:30px}}
@media (max-width:900px){body{grid-template-columns:60px minmax(0,1fr)}.grp{height:1px;margin:10px 6px;background:var(--lineHair);font-size:0}.nv{justify-content:center;padding:0;position:relative}.nv span{display:none}.nv b{position:absolute;top:2px;right:4px;font-size:0}.nv b.hot{font-size:10px;min-width:15px;height:15px;padding:0 3px}}
/* main */
main{grid-row:2;overflow:auto;min-width:0;scroll-behavior:smooth}
.page{max-width:1280px;margin:0 auto;padding:22px clamp(16px,2.6vw,32px) 64px}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--ink2)}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bgPanel);white-space:nowrap;transition:background var(--t-fast) var(--ease),border-color var(--t-fast)}
.btn:hover{background:var(--bgHover);border-color:#34343e}
a.btn{color:inherit;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onFill);font-weight:600}
.btn.pri:hover{background:var(--accentHi)}
.btn.dng{color:var(--err)}
.btn.dng:hover{border-color:#5a2f2a;background:#24161a}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active{transform:translateY(1px)}
/* cards & tiles */
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{border:1px solid var(--line);border-radius:10px;background:var(--bgPanel);min-width:0}
.card>.ch{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-bottom:1px solid var(--lineHair);font-weight:600}
.card>.ch .r{margin-left:auto;font-weight:400}
.card>.cb{padding:12px 14px}
.tile{display:grid;gap:4px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bgPanel);text-align:left;transition:border-color var(--t-fast),background var(--t-fast),transform var(--t-med) var(--ease-out)}
button.tile:hover{border-color:#3a3a46;background:var(--bgRaised);transform:translateY(-1px)}
.tile .l{color:var(--ink2);font-size:12px}
.tile .v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--ink3)}
.sys{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--lineHair);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sysc{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 14px;background:var(--bgPanel);color:inherit;text-decoration:none;min-width:0}
a.sysc:hover{background:var(--bgRaised)}
.sysc .k{font-weight:500}.sysc small{display:block;color:var(--ink3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sysc .v{font:12px var(--f-mono);color:var(--ink2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err);box-shadow:0 0 0 3px rgba(230,112,95,.16)}.dot.run{background:var(--cyan);animation:breathe 1.6s var(--ease) infinite}
@keyframes breathe{50%{opacity:.4}}
/* toolbar + table */
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.fld{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bgPanel);min-width:220px;flex:0 1 320px}
.fld input{flex:1;min-width:0;background:none;border:0;outline:0}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:14px;color:var(--ink2);white-space:nowrap}
.chip:hover{color:var(--ink);border-color:#34343e}
.chip.on{background:var(--bgSoft);color:var(--ink);border-color:#3a3a46}
.chip i{font-style:normal;font:11px var(--f-mono);color:var(--ink3);margin-left:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bgPanel)}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{height:34px;padding:0 12px;text-align:left;font-weight:500;color:var(--ink3);font-size:12px;border-bottom:1px solid var(--line);background:var(--bgDeep);white-space:nowrap;user-select:none}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:var(--ink2)}
.tbl td{height:46px;padding:0 12px;border-bottom:1px solid var(--lineHair);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.tbl td.wrap{white-space:normal;max-width:460px;padding-top:8px;padding-bottom:8px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.go{cursor:pointer}
.tbl tbody tr{transition:background var(--t-fast)}
.tbl tbody tr:hover{background:var(--bgRaised)}
.tbl tbody tr.sel{background:#1f1a18}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .cb{width:36px;padding-right:0}
.tbl input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .av,.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#14110d;flex:none}
.who b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--ink3);overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:500;background:var(--bgSoft);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.pill.pro{color:#f0c3a8;border-color:#4a3024;background:#22160f}
.pill.team{color:#a9c4f2;border-color:#28344d;background:#141a26}
.pill.ok{color:var(--ok);border-color:#2a4231;background:#121c15}
.pill.warn{color:var(--warn);border-color:#4a3c22;background:#1f1a10}
.pill.err{color:var(--err);border-color:#4a2a26;background:#21130f}
.mbar{display:inline-block;width:60px;height:5px;border-radius:3px;background:var(--bgSoft);vertical-align:middle;margin-left:8px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--cyan)}
.bulk{position:sticky;bottom:14px;margin:12px auto 0;display:flex;align-items:center;gap:8px;width:max-content;max-width:100%;padding:8px 10px 8px 14px;border:1px solid #3a3a46;border-radius:10px;background:var(--bgRaised);box-shadow:var(--e2);animation:rise .25s var(--ease-out);flex-wrap:wrap}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.empty{padding:28px;text-align:center;color:var(--ink3)}
.sk{display:block;height:12px;width:60%;border-radius:6px;background:var(--bgSoft)}
@media (max-width:1100px){.hide-s{display:none}}
/* queue cards */
.q{display:grid;gap:10px}
.qi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bgPanel);transition:border-color var(--t-fast),opacity var(--t-med),transform var(--t-med) var(--ease-out)}
.qi.cur{border-color:var(--accent)}
.qi .meta{color:var(--ink3);font-size:12px;margin-bottom:6px}
.qi .txt{line-height:1.55;overflow-wrap:anywhere}
.qi .acts{display:flex;flex-direction:column;gap:6px;align-self:start}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,5,8,.45);opacity:0;pointer-events:none;transition:opacity var(--t-med);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
aside.dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:var(--bgPanel);border-left:1px solid var(--line);box-shadow:var(--e2);transform:translateX(102%);transition:transform .26s var(--ease-out);z-index:41;display:flex;flex-direction:column}
aside.dr.on{transform:none}
.dh{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--lineHair)}
.dh .who .av{width:40px;height:40px;font-size:14px}
.dh .who b{font-size:15px}
.x{margin-left:auto;width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;color:var(--ink2);flex:none}
.x:hover{background:var(--bgHover);color:var(--ink)}
.db{flex:1;overflow:auto;padding:4px 16px 16px}
.ds{padding:14px 0;border-bottom:1px solid var(--lineHair)}
.ds:last-child{border-bottom:0}
.ds h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:7px 12px;margin:0}
.kv dt{color:var(--ink3)}.kv dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{height:30px;padding:0 14px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--bgSoft);color:var(--ink)}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--lineHair)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.li .t small{display:block;color:var(--ink3)}
.df{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--lineHair);flex-wrap:wrap;align-items:center}
.adv{font:11.5px/1.6 var(--f-mono);color:var(--ink3);white-space:pre-wrap;word-break:break-all}
details.adv-d summary{cursor:pointer;color:var(--ink3);font-size:12px;list-style:none}
details.adv-d summary::-webkit-details-marker{display:none}
details.adv-d summary::before{content:"▸ "}
details.adv-d[open] summary::before{content:"▾ "}
/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bgPanel);color:var(--ink);padding:0;width:min(440px,92vw);box-shadow:var(--e2)}
dialog::backdrop{background:rgba(5,5,8,.55)}
dialog form{display:grid;gap:12px;padding:18px}
dialog h2{margin:0;font-size:16px}
dialog p{margin:0;color:var(--ink2);overflow-wrap:anywhere}
label.f{display:grid;gap:5px;color:var(--ink2);font-size:12px}
.in,select.in,textarea.in{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bgDeep);outline:0;min-width:0}
textarea.in{height:auto;min-height:90px;padding:8px 10px;resize:vertical;line-height:1.5}
.in:focus{border-color:var(--accent)}
.in::placeholder{color:var(--ink3)}
.dfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
/* toast */
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:grid;gap:8px;z-index:90}
.toast{display:flex;align-items:center;gap:12px;min-width:300px;max-width:min(560px,92vw);padding:10px 12px 10px 14px;border:1px solid #3a3a46;border-radius:10px;background:var(--bgRaised);box-shadow:var(--e2);animation:rise .22s var(--ease-out)}
.toast.bad{border-color:#5a2f2a}
.toast span{flex:1;overflow-wrap:anywhere}
.toast small{color:var(--ink3)}
/* palette */
.pal{position:fixed;inset:0;z-index:95;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(5,5,8,.5)}
.pal.on{display:flex}
.pal .box{width:min(600px,92vw);border:1px solid var(--line);border-radius:12px;background:var(--bgPanel);box-shadow:var(--e2);overflow:hidden;animation:rise .18s var(--ease-out)}
.pal input{width:100%;height:48px;padding:0 16px;background:none;border:0;border-bottom:1px solid var(--line);outline:0;font-size:15px}
.pal .res{max-height:50vh;overflow:auto;padding:6px}
.pal .it{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border-radius:var(--r);text-align:left;white-space:nowrap;overflow:hidden}
.pal .it.on,.pal .it:hover{background:var(--bgSoft)}
.pal .it small{margin-left:auto;color:var(--ink3);padding-left:12px}
.chart{width:100%;height:180px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink2);font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
.sec{margin-top:22px}
.sec>h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;font-weight:600}
.sec>h2 .r{margin-left:auto;font-weight:400}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{height:36px;padding:0 14px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button i{font-style:normal;font:11px var(--f-mono);color:var(--ink3);margin-left:6px}
.strip{display:flex;align-items:center;gap:2px;margin:-6px 0 18px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--bgPanel);flex-wrap:wrap}
.strip>button{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--r);white-space:nowrap}
.strip>button:hover{background:var(--bgHover)}
.strip .k{color:var(--ink2)}.strip .v{font-weight:500}
.strip .live{margin-left:auto;padding:0 10px;color:var(--ink3);font-size:12px;white-space:nowrap}
.lnk{color:var(--ink);text-decoration:underline;text-decoration-color:#4a4a55;text-underline-offset:2px}
.lnk:hover{text-decoration-color:var(--accent)}
.more{width:28px;height:28px;border-radius:var(--r);color:var(--ink2);display:inline-grid;place-items:center}
.more:hover{background:var(--bgHover);color:var(--ink)}
.menu{position:fixed;z-index:70;min-width:200px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--bgRaised);box-shadow:var(--e2);animation:rise .14s var(--ease-out)}
.menu button,.menu a{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:var(--r);text-align:left;color:inherit;text-decoration:none}
.menu button:hover,.menu button:focus-visible,.menu a:hover{background:var(--bgSoft)}
.menu button.dng{color:var(--err)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .lab{padding:6px 10px 2px;color:var(--ink3);font-size:11px}
dialog .bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.appear{animation:fadeUp .4s var(--ease-out) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
.cmdout{margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bgDeep);white-space:pre-wrap;overflow-wrap:anywhere}
.cmdout.bad{border-color:#5a2f2a}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
 <span class="mark"><i>A</i>ArchHub</span>
 <span class="crumb" id="crumb">/ Cockpit</span>
 <span class="local" id="local" title="This page is served from this PC with seeded test accounts">local test data</span>
 <button class="search" id="openPal" aria-label="Find a person, a company or an action"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Find a person, company or action<kbd>Ctrl K</kbd></button>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = {
 dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
 co:'<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2M10 21v-3h4v3"/>',
 card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
 shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.8 7L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
 bot:'<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 4v4M9 13h.01M15 13h.01M9 17h6"/>',
 pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
 log:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>', ext:'<path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
 dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', plus:'<path d="M12 5v14M5 12h14"/>'
};
const I = (n, s=16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]||''}</svg>`;

/* ---------- the server: every read and every action is a /founder/api route ---------- */
async function api(path, body = undefined){
 try {
  const r = await fetch(path.startsWith('/founder/api/') ? path : '/founder/api'+path, {method: body === undefined ? 'GET' : 'POST',
   headers: body === undefined ? {'Accept':'application/json'} : {'Accept':'application/json','Content-Type':'application/json'},
   body: body === undefined ? undefined : JSON.stringify(body)});
  if (r.status === 403) { location.href = '/founder/login'; return {ok:false, d:{}, error:'Signed out'}; }
  let d = {}, unreadable = '';
  try { d = await r.json(); } catch (err) { unreadable = 'The server answer could not be read ('+(err && err.name || 'parse error')+')'; }
  const detail = typeof d.detail === 'string' ? d.detail : '';
  return {ok: r.ok && !unreadable && d.ok !== false, status: r.status, d, unreadable: Boolean(unreadable),
   error: d.error || detail || d.message || unreadable || (r.ok ? '' : 'The server answered '+r.status)};
 } catch { return {ok:false, status:0, d:{}, error:'The server did not answer'}; }
}
/* the page's own waits, in one place: typing pause before a search, palette pause, the quiet re-read */
const WAIT = Object.freeze({typing: 250, palette: 200, refresh: 60000});
const S = {overview:null, inbox:null, users:null, companies:null, stripe:null, relay:null, errors:null, tasks:null, actions:null, pending:null, members:null, facts:null, user:null, err:{}};
const now = () => Date.now() / 1e3;
const ago = t => { if (!t) return 'never'; const s = now() - t; return s < 90 ? 'just now' : s < 3600 ? Math.round(s/60)+' min ago' : s < 86400 ? Math.round(s/3600)+' h ago' : Math.round(s/86400)+' d ago'; };
const day = t => t ? new Date(t*1e3).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : 'None';
const num = n => Number(n || 0).toLocaleString('en-US');
/* shortcut: two-decimal currencies only (USD today); read the exponent from Stripe when a zero-decimal currency is sold */
const recorded = (minor, cur) => minor == null ? 'amount not recorded' : money(minor, cur);
const money = (minor, cur = 'usd') => new Intl.NumberFormat('en-US', {style:'currency', currency:(cur || 'usd').toUpperCase()}).format((minor || 0) / 100);
const dollars = n => n == null ? 'hidden' : '$'+Number(n).toLocaleString('en-US', {maximumFractionDigits:2});
const PLAN = {trial:'Trial', solo:'Solo', studio:'Studio', firm:'Firm'};
const planPill = p => `<span class="pill ${p === 'solo' ? 'pro' : p === 'studio' || p === 'firm' ? 'team' : ''}">${esc(PLAN[p] || p)}</span>`;
const COLORS = ['#d8c5a8','#a9c4f2','#b9d8b2','#e7b8a6','#c9b6e4','#9fd3d1','#ead39a'];
const nameOf = u => u.full_name || (u.profile && u.profile.full_name) || String(u.email || '').split('@')[0];
const initials = n => String(n).split(/[\s._-]+/).filter(Boolean).map(x => x[0]).join('').slice(0, 2).toUpperCase();
const av = u => { let h = 0; for (const c of String(u.email)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `<span class="av" style="background:${COLORS[h % COLORS.length]}">${esc(initials(nameOf(u)))}</span>`; };
const who = u => `<span class="who">${av(u)}<span><b>${esc(nameOf(u))}</b><small>${esc(u.email)}</small></span></span>`;
const skRows = (cols, n = 5) => Array.from({length:n}, () => `<tr>${Array.from({length:cols}, () => '<td><span class="sk"></span></td>').join('')}</tr>`).join('');
const failed = (what, key) => `<div class="empty card">${esc(what)} could not be read: ${esc(S.err[key])}. <button class="lnk" data-a="reload">Read again</button></div>`;

function toast(text, detail = '', {undo, logged, bad, again} = {}){
 const el = document.createElement('div'); el.className = 'toast'+(bad ? ' bad' : '');
 el.innerHTML = `<span>${esc(text)}${detail ? ` <small>· ${esc(detail)}</small>` : ''}${logged ? ' <small>· Logged</small>' : ''}</span>${logged ? '<button class="btn sm" data-view>View</button>' : ''}${undo ? '<button class="btn sm" data-undo>Undo</button>' : ''}${again ? `<button class="btn sm" data-again>${esc(again.label)}</button>` : ''}`;
 if (logged) el.querySelector('[data-view]').onclick = () => { el.remove(); go('settings'); };
 if (undo) el.querySelector('[data-undo]').onclick = () => { el.remove(); undo(); };
 if (again) el.querySelector('[data-again]').onclick = () => { el.remove(); again.run(); };
 $('#toasts').append(el); setTimeout(() => el.remove(), undo || again ? 12000 : bad ? 6000 : 4000);
}
/* one action: call the route, say what happened, read the page again. The server writes the audit row. */
/* a route template filled with its values: '/founder/api/packs/{pack_id}/takedown' + {pack_id} */
const at = (route, values) => route.replace(/\{(\w+)\}/g, (_, name) => encodeURIComponent(values[name]));
const newKey = () => (window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
async function guarded(text, detail, path, body, key = newKey()){
 const r = await api(path, {...body, action_key:key}), d = r.d || {};
 const askAgain = {label:'Ask again', run:() => guarded(text, detail, path, body, key)};      // same key: the server's record, never a second send
 // a fresh key only after a DEFINITE refusal; a refused invite email is sent again for the same invite
 const sendAgain = d.created ? {label:'Send again', run:() => guarded('Invite email sent', detail, path.replace(/\/resend$/, '')+'/resend', {email:body.email})}
                             : {label:'Send again', run:() => guarded(text, detail, path, body)};
 const toList = {label:'Open the list', run:() => go('settings')};
 /* no answer, or an answer that is not ours (a 5xx without our JSON): the same key asks the server what happened */
 if (r.status === 0 || r.unreadable || (r.status >= 500 && !('ok' in d))) { toast('No clear answer from the server', detail+' · nothing is sent again unless you ask', {bad:true, again:askAgain}); return r; }
 if (d.state === 'in_flight') { toast('Still running', detail, {again:askAgain}); return r; }
 if (d.state === 'uncertain' && d.replay && d.replay.stripe_url) { const url = d.replay.stripe_url;   // a refund: looked at in Stripe, never repeated here
  toast(d.replay.message, recorded(d.replay.amount, d.replay.currency)+' · '+(d.replay.customer || 'customer not recorded')+' · '+d.replay.payment_intent, {bad:true, again:{label:'Open in Stripe', run:() => window.open(url, '_blank', 'noopener,noreferrer')}}); await load(); return r; }
 if (d.state === 'uncertain') { toast('May have been sent; check before sending again', detail+' · held in Unresolved actions', {bad:true, again:toList}); await load(); return r; }
 if (d.state === 'held') { toast('Not started: something earlier is unresolved', r.error, {bad:true, again:toList}); return r; }
 if (!r.ok) { toast(d.created ? 'Invite created, email not sent' : text+' did not happen', r.error, {bad:true, logged:d.retryable, again:d.refused ? sendAgain : null}); await load(); return r; }
 toast(text, detail+(d.repeat ? ' · already done, nothing sent again' : ''), {logged:true}); await load(); return r;
}
async function act(text, detail, call, undo = null){
 const r = await call();
 if (r.unreadable) { toast('No clear answer from the server', text+' · '+detail+' · the page shows what the server now holds', {bad:true}); await load(); return r; }
 if (!r.ok) { toast(text+' did not happen', r.error, {bad:true}); return r; }
 toast(text, detail, {logged:true, undo});
 await load();
 return r;
}
function ask({title, body, fields = [], ok = 'Confirm', danger = false}){
 return new Promise(res => {
  const d = $('#dlg');
  d.innerHTML = `<form method="dialog"><h2>${esc(title)}</h2>${body ? `<p>${esc(body)}</p>` : ''}${fields.map(f => `<label class="f">${esc(f.label)}${f.type === 'select' ? `<select class="in" name="${f.name}">${f.options.map(o => Array.isArray(o) ? `<option value="${esc(o[0])}"${o[0] === f.value ? ' selected' : ''}>${esc(o[1])}</option>` : `<option${o === f.value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>` : f.type === 'area' ? `<textarea class="in" name="${f.name}" placeholder="${esc(f.ph||'')}">${esc(f.value||'')}</textarea>` : `<input class="in" name="${f.name}" value="${esc(f.value||'')}" placeholder="${esc(f.ph||'')}" autocomplete="off" ${f.type === 'number' ? 'type="number" min="0" step="0.01"' : ''}>`}</label>`).join('')}<div class="dfoot"><button class="btn" value="no">Cancel</button><button class="btn ${danger ? 'dng' : 'pri'}" value="yes">${esc(ok)}</button></div></form>`;
  const form = d.querySelector('form');
  form.onsubmit = e => { if (!e.submitter || e.submitter.value !== 'yes') return;
   const wrong = fields.find(f => { const v = form.elements[f.name].value.trim(); return (f.match && v.toUpperCase() !== f.match) || (f.req && !v); });
   if (wrong) { e.preventDefault(); const i = form.elements[wrong.name]; i.classList.remove('bad'); void i.offsetWidth; i.classList.add('bad'); i.focus(); } };
  d.onclose = () => { if (d.returnValue !== 'yes') { res(null); return; } res(Object.fromEntries(new FormData(form).entries())); };
  d.returnValue = ''; d.showModal(); const first = d.querySelector('input,textarea,select'); if (first) first.focus();
 });
}
function download(name, rows){
 const csv = rows.map(r => r.map(c => '"'+String(c ?? '').replace(/"/g,'""')+'"').join(',')).join('\n');
 const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- navigation (rail order: Inbox first, System and Settings last) ---------- */
const NAV = [
 ['Act', [['inbox','Inbox','dash']]],
 ['Manage', [['users','Users','user'],['companies','Companies & seats','co'],['billing','Billing','card'],['community','Community','shield'],['feedback','Feedback','chat']]],
 ['Run', [['system','System','pulse'],['settings','Settings & audit','log']]]
];
let page = (location.hash || '#inbox').slice(1), ui = {q:'', filter:'all', sort:'created_at', dir:-1, sel:new Set(), tab:{}, cmd:null, cur:0};
const inboxOf = kind => S.inbox ? S.inbox.items.filter(i => i.kind === kind) : [];
function counts(){
 const o = S.overview, c = {};
 if (S.inbox) { c.inbox = S.inbox.count; c.billing = inboxOf('payment_failed').length; c.community = inboxOf('community').length + inboxOf('pack_reported').length; c.feedback = inboxOf('feedback').length; c.system = inboxOf('relay_failed').length + inboxOf('error').length; }
 if (o) { c.users = o.users.total_incl_test; c.companies = o.subscriptions.companies; }
 return c;
}
const SYSTEM_MAP = '/founder/map';   // the one link to the System map, from System
const HOT = new Set(['inbox','billing','community','feedback','system']);
function side(){
 const c = counts();
 $('#side').innerHTML = NAV.map(([g, items]) => `<div class="grp">${g}</div>` + items.map(([id, t, ic]) =>
  `<button class="nv${page === id ? ' on' : ''}" data-go="${id}" title="${t}" aria-label="${t}">${I(ic)}<span>${t}</span>${c[id] ? `<b class="${HOT.has(id) ? 'hot' : ''}">${num(c[id])}</b>` : ''}</button>`).join('')).join('');
}
function go(id, opts = {}){ page = id; Object.assign(ui, {q:'', filter:'all', sel:new Set()}, opts); history.replaceState(null, '', '#'+id); closeDr(); paint(true); $('#main').scrollTop = 0; load(); }

/* ---------- reads ---------- */
const put = (key, r, pick) => { if (r.ok) { S[key] = pick(r.d); delete S.err[key]; } else S.err[key] = r.error; };
const READ = {
 base: async () => { const [o, i] = await Promise.all([api('/founder/api/overview'), api('/founder/api/inbox')]); put('overview', o, d => d); put('inbox', i, d => d); },
 users: async () => put('users', await api('/users/find?limit=200&q='+encodeURIComponent(ui.q)+(page === 'users' && ui.filter !== 'all' ? '&only='+ui.filter : '')), d => d),
 companies: async () => put('companies', await api('/founder/api/companies'), d => d.companies),
 stripe: async () => put('stripe', await api('/stripe'), d => d),
 paying: async () => put('paying', await api('/users/find?limit=200&only=paying'), d => d.users),
 relay: async () => put('relay', await api('/relay'), d => d),
 errors: async () => put('errors', await api('/errors'), d => d.errors),
 tasks: async () => put('tasks', await api('/agent-tasks'), d => d),
 actions: async () => put('actions', await api('/actions'), d => d.actions),
 unresolved: async () => put('unresolved', await api('/founder/api/actions/unresolved'), d => d.actions),
 pending: async () => put('pending', await api('/community/pending'), d => d.pending),
 members: async () => put('members', await api('/community/members'), d => d.communities),
 facts: async () => put('facts', await api('/community/facts'), d => d.facts),
 feedback: async () => put('feedback', await api('/founder/api/feedback'+'?status='+(ui.filter === 'all' ? 'new' : ui.filter === 'every' ? '' : ui.filter)), d => d),
 packs: async () => put('packs', await api('/founder/api/packs'), d => d.packs),
 bans: async () => put('bans', await api('/founder/api/community/bans'), d => d.bans),
 daily: async () => put('daily', await api('/founder/api/usage/daily'), d => d)
};
const NEEDS = {inbox:[], users:['users','companies','bans'], companies:['companies'], billing:['stripe','paying','companies'], community:['pending','members','facts','packs','bans'], feedback:['feedback'], system:['relay','errors','tasks','daily'], settings:['actions','unresolved']};
let loading = 0;
async function load(){
 const b = $('#refresh'); b.classList.add('busy'); loading++;
 await Promise.all([READ.base(), ...(NEEDS[page] || []).map(k => READ[k]()), drawer ? readDr() : null]);
 if (--loading === 0) b.classList.remove('busy');
 $('#readAt').textContent = 'Read '+new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
 paint();
}

/* ---------- pages ---------- */
const PAGES = {};
/* one queue item, used by Inbox, Billing and Community: who, what, why, actions inline */
const qItem = it => `<div class="qi${it.cur ? ' cur' : ''}"><div><div class="meta"><span class="pill ${it.tone||''}">${esc(it.label)}</span> &nbsp;${it.who ? `<button class="lnk" data-user="${esc(it.who)}">${esc(it.who)}</button> ` : ''}${ago(it.at)}</div>${it.title ? `<div style="font-weight:500;margin-bottom:2px">${esc(it.title)}</div>` : ''}<div class="txt">${esc(it.text)}</div>${it.why ? `<div class="dim" style="font-size:12px;margin-top:6px">${esc(it.why)}</div>` : ''}</div><div class="acts">${it.acts.map(([t, a, c]) => `<button class="btn sm ${c||''}" data-a="${esc(a)}">${t}</button>`).join('')}</div></div>`;
const KIND = {
 community: i => ({label:'Community post', tone:'team', why:'Shared to '+i.community_id+'. Nobody else sees it until you admit it.', acts:[['Admit','admit:'+i._n,'pri'],['Reject','reject:'+i._n,'dng'], ...(i.who ? [['Ban','ban:'+i.who]] : [])]}),
 payment_failed: i => ({label:'Payment failed', tone:'warn', title:money(i.amount, i.currency)+' did not go through', acts:i.who ? [['Open','user:'+i.who,'pri']] : []}),
 relay_failed: i => ({label:'Relay failed', tone:'err', acts:[['Retry','retry:'+i.id,'pri']]}),
 unresolved: i => i.stripe_url ? ({label:'Refund result unknown', tone:'err', title:recorded(i.amount, i.currency)+' · '+(i.customer || 'customer not recorded')+' · '+i.title.split(' · ').pop(), why:'Nothing here can change it.', acts:[['Open in Stripe','openstripe:'+i._n,'pri']]}) : ({label:'Unresolved send', tone:'warn', why:'Nothing is sent again until you check and say what happened.', acts:[['Check','checkkey:'+i.id,'pri'],['It arrived','arrived:'+i.id],['It did not arrive','notarrived:'+i.id]]}),
 error: i => ({label:'Server error', tone:'err', why:i.where, acts:[['Mark fixed','resolve:'+i._n,'pri'],['Open System','goto:system']]}),
 feedback: i => ({label:'Feedback · '+i.type, tone:i.type === 'bug' ? 'err' : i.type === 'idea' ? 'team' : 'ok', acts:[['Answer','fbreply:'+i.id,'pri'],['Handled','fbstatus:'+i.id+':shipped'],['Open Feedback','goto:feedback']]}),
 pack_reported: i => ({label:'Pack reported', tone:'err', acts:[['Take down','takedown:'+i.id,'dng'],['Open packs','packs']]})
};
const inboxItems = () => (S.inbox ? S.inbox.items : []).map((i, n) => { i._n = n; return {...i, ...KIND[i.kind](i)}; });
function statusStrip(){
 const o = S.overview; if (!o) return `<div class="strip"><span class="live">${S.err.overview ? esc('Status could not be read: '+S.err.overview) : 'Reading the status'}</span></div>`;
 const errs = o.errors.filter(e => now() - e.ts < 86400).length, n = S.inbox ? S.inbox.count : 0, hz = o.system.healthz.ok;
 const cell = (to, dot, k, v) => `<button data-go="${to}"><span class="dot ${dot}"></span><span class="k">${k}</span><span class="v">${esc(v)}</span></button>`;
 return `<div class="strip">${cell('system', hz ? 'ok' : 'err', 'Server', hz ? 'healthy' : 'a check failed')}${cell('users', 'ok', 'Users', num(o.users.total)+(o.users.signups_24h ? ', '+o.users.signups_24h+' new today' : ''))}${cell('billing', 'ok', 'Paying', num(o.subscriptions.paying_subscribers))}${cell('inbox', n ? 'warn' : 'ok', 'Waiting on you', num(n))}${cell('system', errs ? 'err' : 'ok', 'Errors, 24 h', num(errs))}${o.system.version && o.system.version !== 'unknown' ? `<span class="live">Build ${esc(o.system.version)}</span>` : ''}</div>`;
}
PAGES.inbox = () => {
 const L = inboxItems(), f = ui.filter, kinds = [...new Set(L.map(x => x.label))], rows = L.filter(x => f === 'all' || x.label === f);
 return `${statusStrip()}<div class="ph"><div><h1>Inbox</h1><p>Everything waiting on you, newest first. Act from the row; each action is logged.</p></div></div>
 ${S.err.inbox ? failed('The inbox', 'inbox') : !S.inbox ? '<div class="q"><div class="qi"><span class="sk"></span></div><div class="qi"><span class="sk"></span></div></div>' : `
 <div class="bar"><div class="chips"><button class="chip${f === 'all' ? ' on' : ''}" data-f="all">All<i>${L.length}</i></button>${kinds.map(k => `<button class="chip${f === k ? ' on' : ''}" data-f="${esc(k)}">${esc(k)}<i>${L.filter(x => x.label === k).length}</i></button>`).join('')}</div></div>
 <div class="q">${rows.map(qItem).join('') || '<div class="empty card">Nothing waits on you.</div>'}</div>`}`;
};
const coName = id => ((S.companies || []).find(c => c.id === id) || {}).name || '';
function userRows(){
 const rows = (S.users ? S.users.users : []).slice();
 const key = {name:u => nameOf(u).toLowerCase(), plan:u => u.plan, last_seen:u => u.last_seen || 0, msg_used:u => u.msg_used, created_at:u => u.created_at}[ui.sort];
 return rows.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * ui.dir);
}
PAGES.users = () => {
 const rows = userRows(), c = S.users ? S.users.counts : {};
 const th = (k, t, cls = '') => `<th class="s ${cls}" data-sort="${k}" aria-sort="${ui.sort === k ? (ui.dir > 0 ? 'ascending' : 'descending') : 'none'}">${t}${ui.sort === k ? (ui.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`;
 return `<div class="ph"><div><h1>Users</h1><p>Everyone with an ArchHub account. Open one to change the plan, disconnect a device or suspend.</p></div>
  <div class="acts"><button class="btn" data-a="export">${I('dl',14)}Export</button>${c.test ? `<button class="btn dng" data-a="purge">Remove ${num(c.test)} test accounts</button>` : ''}${(S.companies || []).length ? `<button class="btn pri" data-a="invite">${I('plus',14)}Invite</button>` : ''}</div></div>
