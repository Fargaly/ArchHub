      - name: Assign immutable build identity
        id: identity
        shell: pwsh
        run: |
          $stamp = [DateTime]::UtcNow.ToString('yyyyMMdd-HHmmss')
          $buildId = "$stamp-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-${{ steps.source.outputs.revision }}"
          "build_id=$buildId" >> $env:GITHUB_OUTPUT
      - name: Verify independent review and build the bundled runtime from pinned source
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = 'import sys,runpy;owner=runpy.run_path("selected/01.APP/nodelang/host_artifact_review.py");owner["load_review"](sys.argv[1],source_revision=sys.argv[2],bridges_root="selected/01.APP/bridges")'
          python -c $probe $env:BROKER_REVIEW_PATH $env:SOURCE_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'Independent broker review does not decide these source bytes.' }
          $build = Join-Path $env:RUNNER_TEMP 'goose-build'
          python selected/03.TOOLS/packaging/windows/build_goose.py --source (Join-Path $env:RUNNER_TEMP 'goose-src') --output $build --archhub-rev $env:SOURCE_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'Goose did not build from its pinned source.' }
          "GOOSE_BUILD_PATH=$build" >> $env:GITHUB_ENV
      - name: Use Setup's Python for the packed connector runtime
        id: runtime_python
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'goose' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
          architecture: x64
          update-environment: false
      - name: Compile Studio and installer from verified source snapshots
        id: installer
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'goose' }}
        shell: pwsh
        env:
          BUILD_ID: ${{ steps.identity.outputs.build_id }}
          RUNTIME_PYTHON_PATH: ${{ steps.runtime_python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:RUNTIME_PYTHON_PATH) { throw 'Setup runtime Python was not provisioned.' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'Visual Studio discovery is missing.' }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'The runner Visual Studio x64 toolchain was not found.' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) { throw 'The selected Visual Studio x64 setup is missing.' }
          # The compiler packager imports this checkout's x64 setup for both Cargo and dumpbin.
          $msvc = Join-Path $env:GITHUB_WORKSPACE 'selected/03.TOOLS/tools/archhub-compiler/target/msvc'
          New-Item -ItemType Directory -Force -Path $msvc | Out-Null
          Set-Content -LiteralPath (Join-Path $msvc 'setup_x64.bat') -Encoding ascii -Value @('@echo off', ('call "{0}"' -f $vcvars))
          try {
            ./selected/03.TOOLS/installer/build_release.ps1 `
              -BuildId $env:BUILD_ID -RuntimePythonPath $env:RUNTIME_PYTHON_PATH `
              -GooseBuildPath $env:GOOSE_BUILD_PATH -BrokerReviewPath $env:BROKER_REVIEW_PATH `
              -OutputDirectory "$env:GITHUB_WORKSPACE/release-output"
          } catch {
            if ($_.Exception.Message -ceq 'Stable release native host coverage failed; no installer was compiled.') {
              'missing_host_payloads=true' >> $env:GITHUB_OUTPUT
            }
            throw
          }
      - name: Prepare standalone Goose runtime checksums
        id: goose_checksums
        if: ${{ !cancelled() && ((success() && github.event_name == 'workflow_dispatch' && inputs.mode == 'goose') || (failure() && steps.installer.outputs.missing_host_payloads == 'true')) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('goose.exe', 'receipt.json', 'LICENSE')) {
            $path = Join-Path $env:GOOSE_BUILD_PATH $name
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -LiteralPath "$path.sha256" -Encoding ascii
          }
      - name: Retain standalone Goose runtime, receipt and license
        if: ${{ !cancelled() && steps.goose_checksums.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: archhub-goose-${{ steps.identity.outputs.build_id }}
          path: |
            ${{ runner.temp }}/goose-build/goose.exe
            ${{ runner.temp }}/goose-build/goose.exe.sha256
            ${{ runner.temp }}/goose-build/receipt.json
            ${{ runner.temp }}/goose-build/receipt.json.sha256
            ${{ runner.temp }}/goose-build/LICENSE
            ${{ runner.temp }}/goose-build/LICENSE.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Prove Office round-trips in the built Goose
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        working-directory: selected
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ARCHHUB_RELEASE_GOOSE_EXE = (Resolve-Path -LiteralPath (Join-Path $env:GOOSE_BUILD_PATH 'goose.exe')).ProviderPath
          python -B -m pytest -q -s 02.TESTS/tests_replica/test_goose_source.py::test_release_goose_office_round_trips
          if ($LASTEXITCODE -ne 0) { throw 'Office round-trips failed in the built Goose.' }
      - name: Prove installed users' updater accepts this build (dry run)
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        shell: pwsh
        run: |
          ./selected/03.TOOLS/packaging/windows/publish_release.ps1 `
            -ReleaseDirectory "$env:GITHUB_WORKSPACE/release-output" `
            -ExpectedSourceRevision '${{ steps.source.outputs.revision }}' -DryRun
      - name: Retain exact installer and metadata for review
        id: upload
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        uses: actions/upload-artifact@v7
        with:
          name: archhub-installer-${{ steps.identity.outputs.build_id }}
          path: |
            release-output/ArchHub-Setup-0.exe
            release-output/release.json
            release-output/release-notes.md
            release-output/source-manifest.tsv
            release-output/installed-source-manifest.tsv
            release-output/studio-build.json
            release-output/BUILD_METADATA.json
          if-no-files-found: error
          compression-level: 0
      - name: Prepare build-only artifact checksums
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'build' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B selected/03.TOOLS/tools/real_app_check/profile_guard.py --profile "$env:RUNNER_TEMP/archhub-offer-check" selected/03.TOOLS/packaging/windows/check_update_offer.py release-output --expected-revision '${{ steps.source.outputs.revision }}'
          if ($LASTEXITCODE -ne 0) { throw 'Build-only Setup failed the stable release check. Use goose mode for a runtime-only artifact.' }
          Copy-Item -LiteralPath (Join-Path $env:GOOSE_BUILD_PATH 'goose.exe'), (Join-Path $env:GOOSE_BUILD_PATH 'receipt.json') -Destination release-output
          Copy-Item -LiteralPath (Join-Path $env:GOOSE_BUILD_PATH 'LICENSE') -Destination release-output/goose-LICENSE.txt
          foreach ($name in @('ArchHub-Setup-0.exe', 'goose.exe', 'receipt.json')) {
            $path = Join-Path release-output $name
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -LiteralPath "$path.sha256" -Encoding ascii
          }
      - name: Retain build-only installer, Goose and receipt
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: archhub-build-${{ steps.identity.outputs.build_id }}
          path: |
            release-output/ArchHub-Setup-0.exe
            release-output/ArchHub-Setup-0.exe.sha256
            release-output/goose.exe
            release-output/goose.exe.sha256
            release-output/receipt.json
            release-output/receipt.json.sha256
            release-output/goose-LICENSE.txt
            release-output/release.json
            release-output/release-notes.md
            release-output/source-manifest.tsv
            release-output/installed-source-manifest.tsv
            release-output/studio-build.json
            release-output/BUILD_METADATA.json
          if-no-files-found: error
          compression-level: 0
      - name: Retain failed snapshot and partial build for inspection
        if: ${{ failure() && (github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) }}
        uses: actions/upload-artifact@v7
        with:
          name: archhub-failed-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-output/
          if-no-files-found: ignore
          compression-level: 0

  publish:
    needs: build
    if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the publish check at the built revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_revision }}
          path: selected
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the update parser's runtime
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r selected/requirements.txt
      - name: Download this run's exact build artifact
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-output
      - name: Verify and publish complete updater release
        if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_ID: ${{ needs.build.outputs.build_id }}
          SOURCE_REVISION: ${{ needs.build.outputs.source_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -LiteralPath release-output/release.json -Raw | ConvertFrom-Json
          if ($manifest.build_id -cne $env:BUILD_ID) { throw 'Downloaded artifact is not this run''s build.' }
          # One reconciliation and publish path for CI and local builds: bytes,
          # updater readability, newer than live latest, free tag, pushed source.
          ./selected/03.TOOLS/packaging/windows/publish_release.ps1 `
            -ReleaseDirectory release-output -ExpectedSourceRevision $env:SOURCE_REVISION `
            -Repository $env:GH_REPO


  verify-published:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-published' }}
    runs-on: windows-2025
    timeout-minutes: ${{ fromJSON(inputs.verify_minutes) }}
    permissions:
      contents: read
    env:
      PUBLISHED_REPOSITORY: Fargaly/ArchHub
      PUBLISHED_BUILD: 20261120-143339-44754205914-1-7c364326cfec80539087ac8153d5616322a78955
      PUBLISHED_SHA256: 62772163849761374db264a247e21bf3a50b7b170986f224cfff5f0f421bfeb6
      PUBLISHED_BYTES: '416586952'
      VERIFY_MINUTES: ${{ inputs.verify_minutes }}
      VERIFY_WORKSHOP_REPLIES: ${{ inputs.verify_workshop_replies }}
      VERIFY_PREVIOUS_CANVAS: ${{ inputs.verify_previous_canvas }}
      VERIFY_F38: ${{ inputs.verify_f38 }}
      VERIFY_CONNECTORS: ${{ inputs.verify_connectors }}
      PREVIOUS_INSTALLER: ${{ inputs.previous_installer }}
      PUBLISHED_CANDIDATE: ${{ inputs.published_candidate }}
    steps:
      - name: Check out the verification tools only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: selected
          persist-credentials: false
      - name: Prepare the pinned release contract and Settings evidence
        id: pins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'archhub-verify-published'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          "VERIFY_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          $source = Get-Content -Raw selected/03.TOOLS/tools/real_app_check/scenarios/settings.mjs
          $block = [regex]::Match($source, '(?s)export const steps=\[(.*?)\];').Groups[1].Value
          $names = @([regex]::Matches($block, "'([^']+)'") | ForEach-Object { $_.Groups[1].Value })
          if ($names.Count -ne 12) { throw 'Declare desktop admission, six Settings cases, startup, Projects, scope recovery, Office and Session folder.' }
          $names[0] | ConvertTo-Json | Set-Content (Join-Path $evidence 'declared-admission.json') -Encoding utf8
          $names[1..6] | ConvertTo-Json | Set-Content (Join-Path $evidence 'declared-settings.json') -Encoding utf8
          $names[7] | ConvertTo-Json | Set-Content (Join-Path $evidence 'declared-startup.json') -Encoding utf8
          $names[8] | ConvertTo-Json | Set-Content (Join-Path $evidence 'declared-projects.json') -Encoding utf8
          $names[9] | ConvertTo-Json | Set-Content (Join-Path $evidence 'declared-scope.json') -Encoding utf8
          $names[11] | ConvertTo-Json | Set-Content (Join-Path $evidence 'declared-session-folder.json') -Encoding utf8
          $names[10] | ConvertTo-Json | Set-Content (Join-Path $evidence 'declared-office.json') -Encoding utf8
          @{repository=$env:PUBLISHED_REPOSITORY;build=$env:PUBLISHED_BUILD;workflow_source=$env:GITHUB_SHA;setup_verified=$false;setup_sha256=$null;setup_bytes=$null;install_exit=$null;installed_root=$null;installed_build=$null;first_run_python=$null;first_run_python_version=$null;first_run_exit=$null;ui_exit=$null} |
            ConvertTo-Json | Set-Content (Join-Path $evidence 'install.json') -Encoding utf8
          function Read-Pin([string]$json) {
            $candidate = [System.Text.Json.JsonDocument]::Parse($json)
            try {
              $value = $candidate.RootElement
              if ($value.ValueKind -ne [System.Text.Json.JsonValueKind]::Object) { throw 'Supply one exact installer identity object.' }
              $properties = @($value.EnumerateObject())
              if ($properties.Count -ne 3 -or (($properties.Name | Sort-Object) -join ',') -cne 'build_id,bytes,sha256') { throw 'Supply exactly build_id, bytes and sha256 together.' }
              $build = $value.GetProperty('build_id')
              $bytes = $value.GetProperty('bytes')
              $sha = $value.GetProperty('sha256')
              if ($build.ValueKind -ne [System.Text.Json.JsonValueKind]::String -or $build.GetString() -cnotmatch '\A[A-Za-z0-9._-]{1,128}\z') { throw 'Build ID must match the existing release-offer identity contract.' }
              if ($sha.ValueKind -ne [System.Text.Json.JsonValueKind]::String -or $sha.GetString() -cnotmatch '\A[0-9a-f]{64}\z') { throw 'Supply the exact lowercase installer SHA-256.' }
              if ($bytes.ValueKind -ne [System.Text.Json.JsonValueKind]::Number) { throw 'Installer bytes must be a positive integer.' }
              $length = $bytes.GetInt64()
              if ($length -le 0) { throw 'Installer bytes must be a positive integer.' }
              return @{build=$build.GetString(); sha256=$sha.GetString(); bytes=$length}
            } finally { $candidate.Dispose() }
          }
          function Read-PublishedBuildTime($pin) {
            $url = 'https://github.com/' + $env:PUBLISHED_REPOSITORY + '/releases/download/build-' + $pin.build + '/release.json'
            $response = Invoke-WebRequest -Uri $url
            $json = if ($response.Content -is [byte[]]) { [Text.Encoding]::UTF8.GetString($response.Content) } else { [string]$response.Content }
            $document = [System.Text.Json.JsonDocument]::Parse($json)
            try {
              $release = $document.RootElement
              $revision = $release.GetProperty('source_revision').GetString()
              $suffix = ($pin.build -split '-')[-1]
              if ($release.GetProperty('format').GetInt32() -ne 1 -or
                  $release.GetProperty('build_id').GetString() -cne $pin.build -or
                  $release.GetProperty('asset_name').GetString() -cne 'ArchHub-Setup-0.exe' -or
                  $release.GetProperty('asset_bytes').GetInt64() -ne $pin.bytes -or
                  $release.GetProperty('asset_sha256').GetString() -cne $pin.sha256 -or
                  $revision -cnotmatch '\A[0-9a-f]{40}\z' -or $suffix -cnotmatch '\A[0-9a-f]{7,40}\z' -or
                  !$revision.StartsWith($suffix, [StringComparison]::Ordinal)) {
                throw 'Published release metadata differs from the pinned Setup identity.'
              }
              return [DateTimeOffset]::ParseExact($release.GetProperty('built_at').GetString(), "yyyy-MM-dd'T'HH:mm:ss'Z'",
                [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::AssumeUniversal)
            } finally { $document.Dispose() }
          }
          try {
            if (-not [string]::IsNullOrWhiteSpace($env:PUBLISHED_CANDIDATE)) {
              $pin = Read-Pin $env:PUBLISHED_CANDIDATE
              $env:PUBLISHED_BUILD = $pin.build
              $env:PUBLISHED_BYTES = [string]$pin.bytes
              $env:PUBLISHED_SHA256 = $pin.sha256
              foreach ($key in @('PUBLISHED_BUILD', 'PUBLISHED_SHA256', 'PUBLISHED_BYTES')) { "$key=$([Environment]::GetEnvironmentVariable($key))" >> $env:GITHUB_ENV }
              $receipt = Join-Path $evidence 'install.json'
              $state = Get-Content -Raw $receipt | ConvertFrom-Json
              $state.build = $env:PUBLISHED_BUILD
              $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
            }
            # Only this published Setup has the optional-sign-in contract.
            $stable = $env:PUBLISHED_BUILD -ceq '20261120-190757-44799181046-1-9d03226d4b06f52bd4db9ce0f5854351e6ee6899' -and
                      $env:PUBLISHED_SHA256 -ceq '796135faadb2d5f432bf6951508d5c997f04e735371e2028bfe989c1d139d037' -and
                      $env:PUBLISHED_BYTES -ceq '435230903'
            if ($env:VERIFY_F38 -eq 'true' -and !$stable) { throw 'F38 requires the pinned optional-sign-in stable Setup.' }
            $contract = if ($stable) { 'stable-optional-sign-in' } else { 'gated' }
            $scenarioRevision = if ($stable) { '9d03226d4b06f52bd4db9ce0f5854351e6ee6899' } else { $env:GITHUB_SHA }
            "ui_contract=$contract" >> $env:GITHUB_OUTPUT
            "VERIFY_UI_CONTRACT=$contract" >> $env:GITHUB_ENV
            @{contract=$contract;scenario_revision=$scenarioRevision;build=$env:PUBLISHED_BUILD;setup_sha256=$env:PUBLISHED_SHA256;setup_bytes=[long]$env:PUBLISHED_BYTES} |
              ConvertTo-Json | Set-Content (Join-Path $evidence 'ui-contract.json') -Encoding utf8
            if (-not [string]::IsNullOrWhiteSpace($env:PREVIOUS_INSTALLER)) {
              $prior = Read-Pin $env:PREVIOUS_INSTALLER
              $next = @{build=$env:PUBLISHED_BUILD; bytes=[long]$env:PUBLISHED_BYTES; sha256=$env:PUBLISHED_SHA256}
              if ($prior.build -ceq $next.build -or $prior.sha256 -ceq $next.sha256) { throw 'An upgrade requires distinct Setup identities.' }
              $old = Read-PublishedBuildTime $prior
              $new = Read-PublishedBuildTime $next
              if ($old -ge $new) { throw 'An upgrade requires an earlier previous published build time.' }
              $prior.built_at = $old.ToString('O')
              $prior.target_built_at = $new.ToString('O')
              $prior | ConvertTo-Json | Set-Content (Join-Path $evidence 'upgrade-previous-pin.json') -Encoding utf8
            }
          } catch {
            @{result='FAIL'; failure=$_.Exception.Message} | ConvertTo-Json | Set-Content (Join-Path $evidence 'upgrade-pin-failure.json') -Encoding utf8
            throw
          }
          if (@('15', '20', '25', '30') -cnotcontains $env:VERIFY_MINUTES) { throw 'Choose a supported verification budget.' }
      - name: Verify and install each exact published Setup under the same Windows user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $previousPin = Join-Path $env:VERIFY_EVIDENCE 'upgrade-previous-pin.json'
          $upgrade = Test-Path -LiteralPath $previousPin
          if ($env:VERIFY_PREVIOUS_CANVAS -eq 'true' -and !$upgrade) { throw 'Previous-build Canvas verification requires a pinned previous installer.' }
          if ($env:VERIFY_WORKSHOP_REPLIES -eq 'true' -and !$upgrade) { throw 'Workshop reply verification requires a pinned previous installer.' }
          if ($env:VERIFY_CONNECTORS -eq 'true' -and !$upgrade) { throw 'Connector verification requires a pinned previous installer.' }
          $pins = @()
          if ($upgrade) { $pins += Get-Content -Raw $previousPin | ConvertFrom-Json }
          $pins += @{build=$env:PUBLISHED_BUILD; bytes=[long]$env:PUBLISHED_BYTES; sha256=$env:PUBLISHED_SHA256}
          foreach ($pin in $pins) {
            $previous = $pin.build -cne $env:PUBLISHED_BUILD
            $prefixLog = if ($previous) { 'previous-' } else { '' }
            $receipt = Join-Path $env:VERIFY_EVIDENCE ($prefixLog + 'install.json')
            if ($previous) { Copy-Item (Join-Path $env:VERIFY_EVIDENCE 'install.json') $receipt }
            $state = Get-Content -Raw $receipt | ConvertFrom-Json
            $state.build = $pin.build
            $state | Add-Member -NotePropertyMembers @{expected_sha256=$pin.sha256; expected_bytes=$pin.bytes; upgrade=$upgrade}
            $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $state | Add-Member -NotePropertyName user_sid -NotePropertyValue $sid
            $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
            try {
              $setup = Join-Path $env:RUNNER_TEMP 'ArchHub-Setup-0.exe'
              $tag = 'build-' + $pin.build
              $url = 'https://github.com/' + $env:PUBLISHED_REPOSITORY + '/releases/download/' + $tag + '/ArchHub-Setup-0.exe'
              Invoke-WebRequest -Uri $url -OutFile $setup
              $bytes = (Get-Item -LiteralPath $setup).Length
              $digest = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
              $state.setup_sha256 = $digest
              $state.setup_bytes = $bytes
              if ($bytes -ne [long]$pin.bytes -or $digest -cne $pin.sha256) { throw 'Published Setup identity differs; nothing was executed.' }
              $state.setup_verified = $true
              $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
              $log = Join-Path $env:VERIFY_EVIDENCE ($prefixLog + 'setup.log')
              $process = Start-Process -FilePath $setup -ArgumentList @('/SP-', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/RESTARTEXITCODE=3010', '/TASKS="desktopicon"', ('/LOG="' + $log + '"')) -WindowStyle Hidden -PassThru -Wait
              $state.install_exit = $process.ExitCode
              $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
              if ($process.ExitCode -ne 0) { throw ('Native Setup failed or requires restart: ' + $process.ExitCode) }
              $app = Join-Path $env:LOCALAPPDATA 'ArchHub'
              $state.installed_root = $app
              $state.installed_build = (Get-Content -Raw (Join-Path $app 'BUILD_ID')).Trim()
              $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
              if ($state.installed_build -cne $pin.build) { throw 'The default installed build differs from the pinned release.' }
              $manifest = Get-Content -LiteralPath (Join-Path $app 'source-manifest.tsv')
              $licenseRow = @($manifest | Where-Object { $_ -cmatch '^LICENSE\.md\t' })
              if ($licenseRow) {
                $licenseHash = (Get-FileHash -LiteralPath (Join-Path $app 'LICENSE.md') -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($licenseRow.Count -ne 1 -or $licenseRow[0] -cne ("LICENSE.md" + [char]9 + $licenseHash)) {
                  throw 'Installed product license differs from the Setup manifest.'
                }
                $state | Add-Member -NotePropertyName product_license_sha256 -NotePropertyValue $licenseHash
                $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
              }
              if (!$previous -and $env:VERIFY_CONNECTORS -eq 'true') {
                $seed = Get-Content -Raw (Join-Path $env:VERIFY_EVIDENCE 'upgrade-seed.json') | ConvertFrom-Json
                $runtime = Join-Path $env:LOCALAPPDATA 'ArchHub-Runtime/mcp_supervisor.py'
                $shipped = Join-Path $app 'nodelang/mcp_supervisor.py'
                $post = [ordered]@{stage='after_native_setup_before_launcher_setup'; build=$pin.build
                  run="$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"; result='FAIL'; seeded_sha256=$seed.connectors.runtime_sha256
                  shipped_sha256=$null; runtime_sha256=$null}
                try {
                  $post.shipped_sha256 = (Get-FileHash -LiteralPath $shipped -Algorithm SHA256).Hash.ToLowerInvariant()
                  if (Test-Path -LiteralPath $runtime -PathType Leaf) {
                    $post.runtime_sha256 = (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant()
                  }
                  if ($seed.result -ceq 'PASS' -and $seed.connectors.run -ceq $post.run -and
                      $post.seeded_sha256 -cmatch '^[0-9a-f]{64}$' -and
                      $post.runtime_sha256 -ceq $post.shipped_sha256 -and $post.runtime_sha256 -cne $post.seeded_sha256) {
                    $post.result = 'PASS'
                  }
                } finally {
                  $post | ConvertTo-Json | Set-Content (Join-Path $env:VERIFY_EVIDENCE 'upgrade-post-setup.json') -Encoding utf8
                }
              }
              # Reuse the installed launcher's exact interpreter discovery without starting its updater or UI.
              $launcher = Get-Content -Raw (Join-Path $app 'ArchHub.vbs')
              $discovery = [regex]::Match($launcher, '(?is)Function FindPython\(kind\).*?End Function\s+Function PythonUsable\(candidate\).*?End Function').Value
              $quoting = [regex]::Match($launcher, '(?is)Function QuoteArgument\(value\).*?End Function').Value
              if (-not $discovery -or -not $quoting) { throw 'Installed launcher interpreter discovery or its quoting helper is unavailable.' }
              $probe = Join-Path $env:VERIFY_EVIDENCE 'launcher-python.vbs'
              $prefix = 'Set sh = CreateObject("WScript.Shell")' + "`r`n" + 'Set fso = CreateObject("Scripting.FileSystemObject")' + "`r`n"
              [IO.File]::WriteAllText($probe, $prefix + $quoting + "`r`n" + $discovery + "`r`n" + 'WScript.Echo FindPython("python")', [Text.UTF8Encoding]::new($false))
              $python = (& (Join-Path $env:WINDIR 'System32/cscript.exe') //nologo $probe | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($python) -or -not [IO.Path]::IsPathFullyQualified($python) -or -not (Test-Path -LiteralPath $python)) { throw 'Installed launcher found no usable absolute Python.' }
              $state.first_run_python = $python
              $state.first_run_python_version = (& $python -E -s -c 'import sys; print(sys.version); raise SystemExit(0 if sys.version_info[:2] == (3,14) else 1)' | Out-String).Trim()
              $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
              if ($LASTEXITCODE -ne 0) { throw 'Installed launcher Python does not support the bundled wheelhouse.' }
              & $python -E -s -B (Join-Path $app 'colleague_setup.py') --launcher-setup 2>&1 | Tee-Object -FilePath (Join-Path $env:VERIFY_EVIDENCE ($prefixLog + 'first-run.log'))
              $state.first_run_exit = $LASTEXITCODE
              $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
              if ($state.first_run_exit -ne 0) { throw 'The installed first-run setup did not finish.' }
              if ($upgrade) {
                $phase = if ($previous) { 'seed' } else { 'verify' }
                if (!$previous) {
                  $prior = Get-Content -Raw (Join-Path $env:VERIFY_EVIDENCE 'previous-install.json') | ConvertFrom-Json
                  if ($prior.user_sid -cne $sid -or $prior.installed_root -ine $app) { throw 'The Windows user or install directory changed.' }
                }
                & (Join-Path $app '.venv/Scripts/python.exe') -I -B selected/03.TOOLS/tools/real_app_check/upgrade_persistence.py $phase $pin.build
                if ($LASTEXITCODE -ne 0) { throw "Installed owner persistence check failed during $phase." }
              }
              if ($previous -and $env:VERIFY_PREVIOUS_CANVAS -eq 'true') {
                $witness = 'selected/03.TOOLS/tools/real_app_check'
                $savedPath = $env:PATH
                try {
                  $env:PATH = (Join-Path $app 'runtime') + [IO.Path]::PathSeparator + $savedPath
                  & (Join-Path $app '.venv/Scripts/python.exe') -B (Join-Path $witness 'real_app_check.py') --app $app --scenario (Join-Path $witness 'scenarios/rerun_fork.mjs') --out (Join-Path $env:VERIFY_EVIDENCE 'canvas') --boot-seconds 600 --probe-seconds 300
                  $state | Add-Member -NotePropertyName canvas_exit -NotePropertyValue $LASTEXITCODE
                } catch {
                  $state | Add-Member -NotePropertyName canvas_failure -NotePropertyValue $_.Exception.Message
                } finally {
                  $env:PATH = $savedPath
                }
                $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
              }
            } catch {
              $state | Add-Member -NotePropertyName failure -NotePropertyValue $_.Exception.Message
              $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
              throw
            }
          }
      - name: Verify DWG exports with the installed reader
        if: ${{ inputs.verify_dwg }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Get-Content -Raw (Join-Path $env:VERIFY_EVIDENCE 'install.json') | ConvertFrom-Json
          if (-not $receipt.setup_verified -or $receipt.install_exit -ne 0 -or $receipt.installed_build -cne $env:PUBLISHED_BUILD) {
            throw 'The selected Windows installer must complete before the DWG check.'
          }
          $python = Join-Path $receipt.installed_root '.venv/Scripts/python.exe'
          & $python -I -B selected/03.TOOLS/tools/real_app_check/installed_dwg.py | Tee-Object -FilePath (Join-Path $env:VERIFY_EVIDENCE 'dwg-results.log')
          if ($LASTEXITCODE -ne 0) { throw 'The installed DWG export check failed.' }
      - name: Verify Publish PDF with the installed node engine
        if: ${{ inputs.verify_pdf }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Get-Content -Raw (Join-Path $env:VERIFY_EVIDENCE 'install.json') | ConvertFrom-Json
          if (-not $receipt.setup_verified -or $receipt.install_exit -ne 0 -or $receipt.installed_build -cne $env:PUBLISHED_BUILD) {
            throw 'The selected Windows installer must complete before the PDF check.'
          }
          $python = Join-Path $receipt.installed_root '.venv/Scripts/python.exe'
          & $python -I -B selected/03.TOOLS/tools/real_app_check/installed_pdf.py | Tee-Object -FilePath (Join-Path $env:VERIFY_EVIDENCE 'pdf-results.log')
          if ($LASTEXITCODE -ne 0) { throw 'The installed PDF check failed.' }
      - name: Check out the pinned optional-sign-in release witness
        if: steps.pins.outputs.ui_contract == 'stable-optional-sign-in'
        uses: actions/checkout@v7
        with:
          ref: 9d03226d4b06f52bd4db9ce0f5854351e6ee6899
          path: stable-witness
          sparse-checkout: |
            /03.TOOLS/tools/real_app_check/
            /04.DOCS/SPEC.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Run the pinned actual-window checks on the final installed build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Join-Path $env:VERIFY_EVIDENCE 'install.json'
          $state = Get-Content -Raw $receipt | ConvertFrom-Json
          $app = Join-Path $env:LOCALAPPDATA 'ArchHub'
          $env:PATH = (Join-Path $app 'runtime') + [IO.Path]::PathSeparator + $env:PATH
          $witness = 'selected/03.TOOLS/tools/real_app_check'
          if ($env:VERIFY_UI_CONTRACT -ceq 'stable-optional-sign-in') {
            $contract = Get-Content -Raw (Join-Path $env:VERIFY_EVIDENCE 'ui-contract.json') | ConvertFrom-Json
            $revision = git -C stable-witness rev-parse HEAD
            if ($LASTEXITCODE -ne 0 -or $revision -cne $contract.scenario_revision) { throw 'The stable witness source does not match the pinned release.' }
            $relative = '03.TOOLS/tools/real_app_check/scenarios/settings.mjs'
            $scenario = Join-Path stable-witness $relative
            $original = (Get-FileHash -LiteralPath $scenario -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
            if ($original -cne '4118811518c8bef64cc2a27ccc16327a97cfa577af0f50f88899da33fd2c60c0') { throw 'Unexpected original stable Settings witness' }
            $delta = (Resolve-Path 'selected/03.TOOLS/tools/real_app_check/stable-settings-readiness.patch' -ErrorAction Stop).Path
            git -c core.autocrlf=false -C stable-witness apply --unidiff-zero --include=$relative -- $delta
            if ($LASTEXITCODE -ne 0) { throw 'Stable Settings readiness correction could not be applied' }
            $effective = (Get-FileHash -LiteralPath $scenario -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
            if ($effective -cne '6291c7871ce740372385855197ff7a3ddb9fff79546c7adc179be3369959fd62') { throw 'Unexpected effective stable Settings witness' }
            $contract | Add-Member -NotePropertyMembers @{ original_witness_sha256=$original; effective_witness_sha256=$effective; verification_tools_revision=$env:GITHUB_SHA }
            $contract | ConvertTo-Json | Set-Content (Join-Path $env:VERIFY_EVIDENCE 'ui-contract.json') -Encoding utf8
            $witness = 'stable-witness/03.TOOLS/tools/real_app_check'
          }
          $scenario = Join-Path $witness 'scenarios/settings.mjs'
          if ('${{ inputs.verify_operations }}' -eq 'true' -and $env:VERIFY_UI_CONTRACT -ceq 'gated') {
            $scenario = Join-Path $witness 'scenarios/settings_right_click.mjs'
          }
          & (Join-Path $app '.venv/Scripts/python.exe') -B (Join-Path $witness 'real_app_check.py') --app $app --scenario $scenario --out (Join-Path $env:VERIFY_EVIDENCE 'settings') --boot-seconds 600 --probe-seconds 300
          $state.ui_exit = $LASTEXITCODE
          $state | ConvertTo-Json | Set-Content $receipt -Encoding utf8
          if ($state.ui_exit -ne 0) { throw 'Installed Settings actual-window acceptance failed; inspect the retained report.' }
      - name: Observe F38 warm-up and native Close or Quit on the installed stable build
        if: ${{ !cancelled() && inputs.verify_f38 && steps.pins.outputs.ui_contract == 'stable-optional-sign-in' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receipt = Get-Content -Raw (Join-Path $env:VERIFY_EVIDENCE 'install.json') | ConvertFrom-Json
          if (-not $receipt.setup_verified -or $receipt.install_exit -ne 0 -or $receipt.first_run_exit -ne 0 -or
              $receipt.installed_build -cne $env:PUBLISHED_BUILD) { throw 'The pinned stable installation did not complete.' }
          $app = $receipt.installed_root
          $env:PATH = (Join-Path $app 'runtime') + [IO.Path]::PathSeparator + $env:PATH
          $witness = 'selected/03.TOOLS/tools/real_app_check'
          $out = Join-Path $env:VERIFY_EVIDENCE 'f38'
          & (Join-Path $app '.venv/Scripts/python.exe') -B (Join-Path $witness 'real_app_check.py') --app $app --out $out --verify-warm-close --boot-seconds 90 --probe-seconds 90
          $status = $LASTEXITCODE
          $report = Get-Content -Raw (Join-Path $out 'report.json') | ConvertFrom-Json
          if ($report.label -cne 'INSTALLED BUILD' -or $report.build -cne $receipt.installed_build -or
              $report.installed_code_before -cne $report.installed_code_after -or -not $report.f38.native_close_and_shutdown) {
            throw 'Installed F38 Close/Quit evidence was incomplete.'
          }
          if ($status -ne 0 -or $report.f38.result -cne 'PASS') {
            throw ("Installed F38 witness returned {0}: {1}" -f $report.f38.result, $report.f38.reason)
          }
      - name: Record each Settings outcome even when install or launch failed
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'archhub-verify-published'
          $declared = Join-Path $evidence 'declared-settings.json'
          if (-not (Test-Path -LiteralPath $declared)) { throw 'Verification initialization did not produce declared Settings evidence.' }
          $stepsFile = Join-Path $evidence 'settings/steps.json'
          $actual = @()
          if (Test-Path -LiteralPath $stepsFile) { $actual = @(Get-Content -Raw $stepsFile | ConvertFrom-Json) }
          $rows = @(Get-Content -Raw $declared | ConvertFrom-Json | ForEach-Object {
            $asked = $_
            $found = @($actual | Where-Object { $_.asked -ceq $asked })
            if ($found.Count -eq 1) { $found[0] }
            else { @{asked=$asked;result='NOT EXERCISED';did='Install or actual-window check did not reach this case; no pass claimed.'} }
          })
          $rows | ConvertTo-Json -Depth 12 | Set-Content (Join-Path $evidence 'settings-results.json') -Encoding utf8
          $startup = Get-Content -Raw (Join-Path $evidence 'declared-startup.json') | ConvertFrom-Json
          $found = @($actual | Where-Object { $_.asked -ceq $startup })
          $startupResult = if ($found.Count -eq 1) { $found[0] } else { @{asked=$startup;result='NOT EXERCISED';did='The actual-window check did not reach the startup witness; no pass claimed.'} }
          $startupResult | ConvertTo-Json -Depth 12 | Set-Content (Join-Path $evidence 'startup-result.json') -Encoding utf8
          $extendedCases = [ordered]@{
            projects = 'The actual-window check did not reach the Projects case.'
            scope = 'The actual-window check did not reach scope recovery.'
            office = 'The actual-window check did not reach Office creation.'
            'session-folder' = 'The installed window did not reach the signed-in Session folder picker.'
            admission = 'The actual installed sign-in window was not reached.'
          }
          $optional = $env:VERIFY_UI_CONTRACT -ceq 'stable-optional-sign-in'
          foreach ($case in $extendedCases.Keys) {
            $asked = Get-Content -Raw (Join-Path $evidence "declared-$case.json") | ConvertFrom-Json
            $found = @($actual | Where-Object { $_.asked -ceq $asked })
            $row = if ($optional) {
              @{asked=$asked;result='NOT EXERCISED';did='This case is outside the pinned optional-sign-in release witness.'}
            } elseif ($found.Count -eq 1) { $found[0] }
            else { @{asked=$asked;result='NOT EXERCISED';did=$extendedCases[$case]} }
            $row | ConvertTo-Json -Depth 12 | Set-Content (Join-Path $evidence "$case-result.json") -Encoding utf8
          }
      - name: Verify operations using only the selected installed engine and dependencies
        if: ${{ !cancelled() && inputs.verify_operations }}
        shell: pwsh
        run: |
          $receipt = Get-Content -Raw (Join-Path $env:VERIFY_EVIDENCE 'install.json') | ConvertFrom-Json
          if (-not $receipt.setup_verified -or $receipt.install_exit -ne 0 -or $receipt.installed_build -cne $env:PUBLISHED_BUILD) {
            throw 'The selected installer must complete before checking its operations.'
          }
          $python = Join-Path $receipt.installed_root '.venv/Scripts/python.exe'
          $log = Join-Path $env:VERIFY_EVIDENCE 'operations-results.log'
          $admission = Get-Content -Raw (Join-Path $env:VERIFY_EVIDENCE 'admission-result.json') | ConvertFrom-Json
          if ($admission.result -ceq 'PASS' -and $admission.got.privateContentAbsent -eq $true) {
            'Signed-in Canvas Tools: NOT EXERCISED (installed sign-in gate observed).' | Tee-Object -FilePath $log
          }
          & $python -I -B selected/03.TOOLS/tools/real_app_check/installed_operations.py selected/02.TESTS/tests_replica/fixtures/flow_import | Tee-Object -Append -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'Installed operation verification failed; see operations-results.log.' }
      - name: Report Canvas acceptance on the previous installed build
        if: ${{ always() && inputs.verify_previous_canvas }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prior = Get-Content -Raw (Join-Path $env:VERIFY_EVIDENCE 'previous-install.json') | ConvertFrom-Json
          if ($prior.canvas_failure) { throw $prior.canvas_failure }
          $report = Get-Content -Raw (Join-Path $env:VERIFY_EVIDENCE 'canvas/report.json') | ConvertFrom-Json
          $steps = @(Get-Content -Raw (Join-Path $env:VERIFY_EVIDENCE 'canvas/steps.json') | ConvertFrom-Json)
          $failed = @($steps | Where-Object { $_.result -cne 'PASS' } | ForEach-Object { "$($_.asked): $($_.did)" })
          if ($failed.Count) { throw ($failed -join "; ") }
          if ($null -eq $prior.canvas_exit -or $prior.canvas_exit -ne 0 -or $report.result -cne 'PASS' -or
              $report.label -cne 'INSTALLED BUILD' -or $report.build -cne $prior.installed_build -or $steps.Count -ne 3) {
            throw "Incomplete previous-build Canvas evidence. Installed $($prior.installed_build), observed $($report.build), exit $($prior.canvas_exit), result $($report.result), steps $($steps.Count)."
          }
      - name: Retain install identity, actual window and all six outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archhub-verify-published-${{ env.PUBLISHED_BUILD }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/archhub-verify-published/previous-*
            ${{ runner.temp }}/archhub-verify-published/upgrade-*.json
            ${{ runner.temp }}/archhub-verify-published/install.json
            ${{ runner.temp }}/archhub-verify-published/dwg-results.log
            ${{ runner.temp }}/archhub-verify-published/pdf-results.log
            ${{ runner.temp }}/archhub-verify-published/operations-results.log
            ${{ runner.temp }}/archhub-verify-published/ui-contract.json
            ${{ runner.temp }}/archhub-verify-published/setup.log
            ${{ runner.temp }}/archhub-verify-published/first-run.log
            ${{ runner.temp }}/archhub-verify-published/settings-results.json
            ${{ runner.temp }}/archhub-verify-published/startup-result.json
            ${{ runner.temp }}/archhub-verify-published/projects-result.json
            ${{ runner.temp }}/archhub-verify-published/scope-result.json
            ${{ runner.temp }}/archhub-verify-published/office-result.json
            ${{ runner.temp }}/archhub-verify-published/session-folder-result.json
            ${{ runner.temp }}/archhub-verify-published/admission-result.json
            ${{ runner.temp }}/archhub-verify-published/canvas/report.json
            ${{ runner.temp }}/archhub-verify-published/canvas/steps.json
            ${{ runner.temp }}/archhub-verify-published/canvas/*.png
            ${{ runner.temp }}/archhub-verify-published/settings/report.json
            ${{ runner.temp }}/archhub-verify-published/settings/steps.json
            ${{ runner.temp }}/archhub-verify-published/settings/*.png
            ${{ runner.temp }}/archhub-verify-published/f38/report.json
