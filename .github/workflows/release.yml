name: Selected ArchHub installer

on:
  repository_dispatch:
    types: [archhub-release-approved]
  workflow_dispatch:
    inputs:
      broker_review:
        description: 'Independent archhub-broker-review/v1 JSON for this exact revision'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: selected-archhub-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    outputs:
      build_id: ${{ steps.identity.outputs.build_id }}
      source_revision: ${{ steps.source.outputs.revision }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out selected runtime and installer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.source_revision || github.sha }}
          path: selected
          persist-credentials: false
          # The zero-idle-growth release court archives the old-graph release
          # 9eefd81 from history; a shallow clone refuses every build.
          fetch-depth: 0
      - name: Bind the approved source revision and independent broker review
        id: source
        shell: pwsh
        env:
          APPROVED_REVISION: ${{ github.event.client_payload.source_revision || github.sha }}
          BROKER_REVIEW: ${{ github.event.client_payload.broker_review || inputs.broker_review }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APPROVED_REVISION -cnotmatch '^[0-9a-f]{40}$') { throw 'An exact approved revision is required.' }
          $revision = (git -C selected rev-parse HEAD).Trim()
          if ($revision -cne $env:APPROVED_REVISION) { throw 'Checkout differs from approved source.' }
          $review = Join-Path $env:RUNNER_TEMP 'broker-review.json'
          [IO.File]::WriteAllText($review, $env:BROKER_REVIEW, [Text.UTF8Encoding]::new($false))
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "BROKER_REVIEW_PATH=$review" >> $env:GITHUB_ENV
      - name: Use the reviewed Studio build runtime
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - name: Use the Python that runs the release court and the update check
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the release court's runtime and the installer compiler
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r selected/requirements.txt pytest
          if ($LASTEXITCODE -ne 0) { throw 'Release court dependencies did not install.' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 6 did not install.' }
          }
      - name: Supply the runner's Rust toolchain to the ArchHub compiler
        shell: pwsh
        run: |
          # The compiler refuses a build without a supplied Cargo; the runner image carries rustup.
          $cargoHome = Join-Path $env:USERPROFILE '.cargo'
          $cargo = Join-Path $cargoHome 'bin/cargo.exe'
          if (-not (Test-Path -LiteralPath $cargo)) { throw 'The runner Rust toolchain is missing.' }
          & (Join-Path $cargoHome 'bin/rustup.exe') default stable
          if ($LASTEXITCODE -ne 0) { throw 'The stable Rust toolchain did not install.' }
          & $cargo --version
          "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
          # The registered CLAUDE-BRAIN entrypoint (evidence/acompiler-intents.json) is an absolute
          # path on the founder machine; place the exact bytes there. The compiler re-checks its hash.
          $entry = 'C:\Users\fargaly\00.ARCHUB\70.COMPANY\72.HANDOFFS\72.99-CLAUDE-BRAIN-MOD\ARCHHUB-BRAIN\brain_entry.py'
          New-Item -ItemType Directory -Force -Path (Split-Path $entry) | Out-Null
