# BusyBox httpd config for the static site image.
#
# Without this, a missing URL returned httpd's own built-in body
# ("<HTML><HEAD><TITLE>404 Not Found</TITLE>..."), which has no ArchHub design
# and no way back. E404 points httpd at the 404.html that `astro build` emits
# from src/pages/404.astro.
#
# httpd refuses to serve its own httpd.conf, so shipping it inside the served
# directory does not expose it.
E404:404.html
