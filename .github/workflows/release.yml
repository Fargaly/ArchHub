name: Selected ArchHub installer

on:
  repository_dispatch:
    types: [archhub-release-approved]
  workflow_dispatch:
    inputs:
      broker_review:
        description: 'Independent archhub-broker-review/v1 JSON for this exact revision'
        required: false
        type: string
      mode:
        description: 'release (build and publish), build (installer and Goose artifacts), check (Goose cargo check only), or verify-published (install the pinned public release)'
        required: false
        type: choice
        options: [release, check, build, verify-published]
        default: release
      verify_minutes:
        description: 'Maximum minutes for the clean published-installer check'
        required: false
        type: choice
        options: ['15', '20', '25', '30']

permissions:
  contents: read

concurrency:
  group: selected-archhub-release
  cancel-in-progress: false

jobs:
  # Check-only candidate run: read-only token, no installer, no artifact or cache upload, no publish.
  # Its upper bound is the goose.source node's check_timeout_minutes (the measured 120-minute release-run budget).
  goose-check-budget:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' }}
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      minutes: ${{ steps.budget.outputs.minutes }}
    steps:
      - name: Check out the pinned build settings (read only)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: selected
          persist-credentials: false
          sparse-checkout: 03.TOOLS/packaging/windows/goose-pin.json
          sparse-checkout-cone-mode: false
      - name: Read the check budget from the goose.source node
        id: budget
        if: ${{ inputs.mode == 'check' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $minutes = (Get-Content -Raw selected/03.TOOLS/packaging/windows/goose-pin.json | ConvertFrom-Json).params.check_timeout_minutes
          if ($minutes -isnot [long] -and $minutes -isnot [int]) { throw 'goose.source check_timeout_minutes must be a whole number.' }
          if ($minutes -lt 1) { throw 'goose.source check_timeout_minutes must be positive.' }
          "minutes=$minutes" >> $env:GITHUB_OUTPUT

  goose-check:
    needs: goose-check-budget
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'check' }}
    runs-on: windows-2025
    timeout-minutes: ${{ fromJSON(needs.goose-check-budget.outputs.minutes) }}
    permissions:
      contents: read
    steps:
      - name: Check out the candidate revision (read only)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: selected
          persist-credentials: false
      - name: Use the Python that runs build_goose.py
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Goose from pinned source with ArchHub's patches and lock (cargo check only)
        if: ${{ inputs.mode == 'check' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python selected/03.TOOLS/packaging/windows/build_goose.py --check --source (Join-Path $env:RUNNER_TEMP 'goose-src') --archhub-rev $env:GITHUB_SHA
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            [Console]::Error.WriteLine("goose-cli cargo check failed on the pinned source with ArchHub patches (exit $code).")
            exit $code
          }

  build:
    if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'build')) }}
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      build_id: ${{ steps.identity.outputs.build_id }}
      source_revision: ${{ steps.source.outputs.revision }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out selected runtime and installer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.source_revision || github.sha }}
          path: selected
          persist-credentials: false
          # The zero-idle-growth release court archives the old-graph release
          # 9eefd81 from history; a shallow clone refuses every build.
          fetch-depth: 0
      - name: Bind the approved source revision and independent broker review
        id: source
        shell: pwsh
        env:
          APPROVED_REVISION: ${{ github.event.client_payload.source_revision || github.sha }}
          BROKER_REVIEW: ${{ github.event.client_payload.broker_review || inputs.broker_review }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APPROVED_REVISION -cnotmatch '^[0-9a-f]{40}$') { throw 'An exact approved revision is required.' }
          $revision = (git -C selected rev-parse HEAD).Trim()
          if ($revision -cne $env:APPROVED_REVISION) { throw 'Checkout differs from approved source.' }
          if ([string]::IsNullOrWhiteSpace($env:BROKER_REVIEW)) { throw 'Independent broker review is required to build or publish.' }
          $review = Join-Path $env:RUNNER_TEMP 'broker-review.json'
          [IO.File]::WriteAllText($review, $env:BROKER_REVIEW, [Text.UTF8Encoding]::new($false))
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "BROKER_REVIEW_PATH=$review" >> $env:GITHUB_ENV
      - name: Use the reviewed Studio build runtime
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - name: Install locked Studio build dependencies
        working-directory: selected
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Use the Python that runs the release court and the update check
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the release court's runtime and the installer compiler
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r selected/requirements.txt pytest
          if ($LASTEXITCODE -ne 0) { throw 'Release court dependencies did not install.' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 6 did not install.' }
          }
      - name: Supply the runner's Rust toolchain to the ArchHub compiler
        shell: pwsh
        run: |
          # The compiler refuses a build without a supplied Cargo; the runner image carries rustup.
          $cargoHome = Join-Path $env:USERPROFILE '.cargo'
          $cargo = Join-Path $cargoHome 'bin/cargo.exe'
          if (-not (Test-Path -LiteralPath $cargo)) { throw 'The runner Rust toolchain is missing.' }
          & (Join-Path $cargoHome 'bin/rustup.exe') default stable
          if ($LASTEXITCODE -ne 0) { throw 'The stable Rust toolchain did not install.' }
