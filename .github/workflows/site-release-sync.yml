name: Sync public changelog from GitHub releases

# Keeps CHANGELOG.md (and therefore the baked changelog fallback) aligned with
# every published installer. The live homepage/download card already follows
# /download.json → releases/latest without a redeploy; this job stops the
# repository changelog from drifting after the next release.

on:
  release:
    types: [published]
  workflow_dispatch:
  # Releases created with GITHUB_TOKEN do not emit a follow-on workflow run.
  workflow_run:
    workflows: [Selected ArchHub installer]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: site-release-sync
  cancel-in-progress: false

jobs:
  sync-changelog:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.path == '.github/workflows/release.yml' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       (github.event.workflow_run.event == 'repository_dispatch' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the publish job succeeded on this run attempt
        id: published
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          result=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/attempts/$RELEASE_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | select(.name == "publish") | .conclusion')
          if [[ "$result" == success ]]; then
            echo "confirmed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the default branch
        if: github.event_name != 'workflow_run' || steps.published.outputs.confirmed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Use Python
        if: github.event_name != 'workflow_run' || steps.published.outputs.confirmed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rewrite CHANGELOG.md from published releases
        if: github.event_name != 'workflow_run' || steps.published.outputs.confirmed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python 03.TOOLS/packaging/website/sync_changelog.py
      - name: Commit when the changelog moved
        if: github.event_name != 'workflow_run' || steps.published.outputs.confirmed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already matches published releases."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "CHANGELOG: sync public release notes from GitHub releases"
          git push origin "HEAD:$DEFAULT_BRANCH"
