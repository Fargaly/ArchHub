<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ArchHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Architects+Daughter&display=swap" rel="stylesheet"/>
<style>
  html, body { margin:0; padding:0; background:#0a0a0d; font-family:'Inter',system-ui,sans-serif; color:#ece8e0; }
  *, *::before, *::after { box-sizing: border-box; }
  #root { width:100vw; height:100vh; }
  .ah-scroll::-webkit-scrollbar { width:6px; height:6px; }
  .ah-scroll::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.12); border-radius:3px; }
  .ah-scroll::-webkit-scrollbar-track { background:transparent; }
  /* The pre-mount wait wears the same held moment as AppBoot (studio-account.jsx:139-143 drafting ground, :185 hairline; design DECISIONS.md:613-619): AC.bg #0e0e11 (tokens.jsx:14) under AC.lineHair #1a1a20 (tokens.jsx:45) at the same .35 opacity, and one light mono line. The text stays the runtime's truth: CONNECTING TO THE GRAPH or REFUSED: reason. */
  #studio-boot { position:fixed; inset:0; display:grid; place-items:center; background-color:#0e0e11; background-image:linear-gradient(rgba(26,26,32,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(26,26,32,.35) 1px,transparent 1px); background-size:48px 48px; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#9b938a; letter-spacing:.1em; }
</style>
</head>
<body>
<div id="root"></div>
<div id="studio-boot">CONNECTING TO THE GRAPH&hellip;</div>
<script src="/studio/vendor/react.js"></script>
<script src="/studio/vendor/react-dom.js"></script>
<script src="/studio/studio-authority.js"></script>
<script>
window.ARCHHUB_AUTHORITY = /*__ARCHHUB_AUTHORITY__*/ null;
window.ARCHHUB_BOOT = /*__ARCHHUB_BOOT__*/ null;
(async () => {
  const boot = document.getElementById('studio-boot');
  const fail = why => { boot.textContent = 'REFUSED: ' + why; };
  let studioMount;
  function mountStudio() {
    // One freshness check per page, after the real graph bootstrap. No runtime
    // compiler, polling, or automatic rebuild; npm run build:studio is explicit.
    if (studioMount) return studioMount;
    studioMount = (async () => {
      const names = ['tokens.jsx','design-canvas.jsx','shared-data.jsx',
        'studio-suite.jsx','param-types.jsx','studio-params.jsx',
        'studio-mobile.jsx','studio-account.jsx','node-registry.jsx','brain-model.jsx','studio-workshop.jsx','studio-lm.jsx','mount.jsx'];
      const refusal = message => { throw new Error(message + ' Run npm run build:studio, or install a complete release.'); };
      if (!window.crypto?.subtle) refusal('Studio build verification is unavailable.');
      const asset = async (name, limit) => {
        const response = await fetch('/studio/' + name, {cache:'no-store', redirect:'error'});
        if (!response.ok || !response.body) refusal('Studio build asset is missing: ' + name + '.');
        const reader = response.body.getReader(), chunks = [];
        let length = 0;
        try {
          for (;;) {
            const {done, value} = await reader.read();
            if (done) break;
            length += value.byteLength;
            if (length > limit) { await reader.cancel(); refusal('Studio build asset exceeds its bound.'); }
            chunks.push(value);
          }
        } finally { reader.releaseLock(); }
        const bytes = new Uint8Array(length);
        let offset = 0;
        for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.byteLength; }
        return bytes;
      };
      let manifest;
      const manifestBytes = await asset('compiled/manifest.json', 32768);
      try { manifest = JSON.parse(new TextDecoder('utf-8', {fatal:true}).decode(manifestBytes)); }
      catch (_) { refusal('Studio build manifest is unreadable.'); }
      if (!manifest || manifest.format !== 1 || !Array.isArray(manifest.files) || manifest.files.length !== names.length) {
        refusal('Studio build manifest is invalid.');
      }
      let sourceBytes = 0, outputBytes = 0;
      for (let index = 0; index < names.length; index += 1) {
        const file = manifest.files[index];
        if (!file || file.source !== names[index] || file.output !== names[index].replace(/\.jsx$/, '.js') ||
            !/^[a-f0-9]{64}$/.test(file.source_sha256) || !/^[a-f0-9]{64}$/.test(file.sha256) ||
            !Number.isSafeInteger(file.source_bytes) || file.source_bytes < 0 || file.source_bytes > 524288 ||
            !Number.isSafeInteger(file.bytes) || file.bytes < 1 || file.bytes > 2097152) {
          refusal('Studio build file metadata is invalid.');
        }
        const expectedIntegrity = 'sha256-' + btoa(file.sha256.match(/../g).map(byte => String.fromCharCode(parseInt(byte, 16))).join(''));
        if (file.integrity !== expectedIntegrity) refusal('Studio compiled integrity metadata is invalid.');
        sourceBytes += file.source_bytes; outputBytes += file.bytes;
      }
      if (sourceBytes > 2097152 || outputBytes > 4194304) refusal('Studio build exceeds its aggregate bound.');
      // Read/hash the thirteen fixed sources sequentially. Never fetch vendored Babel.
      // This detects stale source-mode builds without Node on an installed app.
      for (const file of manifest.files) {
        const bytes = await asset(file.source, 524288);
        const hash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)),
          byte => byte.toString(16).padStart(2, '0')).join('');
        if (bytes.byteLength !== file.source_bytes || hash !== file.source_sha256) refusal('Studio build is stale: ' + file.source + '.');
      }
      for (const file of manifest.files) {
        await new Promise((resolve, reject) => {
          const tag = document.createElement('script');
          tag.src = '/studio/compiled/' + file.output + '?sha256=' + file.sha256;
          tag.integrity = file.integrity; tag.crossOrigin = 'anonymous'; tag.async = false;
          tag.onload = resolve;
          tag.onerror = () => reject(new Error('Studio compiled asset is missing or corrupt: ' + file.output + '. Run npm run build:studio, or install a complete release.'));
          document.body.appendChild(tag);
        });
      }
      boot.remove();
    })();
    return studioMount;
  }
  try {
    if (window.ARCHHUB_AUTHORITY) {
      const authority = await window.ArchHubStudioAuthority.boot(window.ARCHHUB_AUTHORITY);
      window.ARCHHUB_THEME = authority.getSnapshot()?.canvas?.configuration?.theme ?? null;
      await mountStudio();
      return;
    }
    let session = window.ARCHHUB_BOOT;
    if (!session) {
      const minted = await fetch('/api/universal/session', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-ArchHub-Sign-In':'1'},
        body:'{}',
      });
      if (!minted.ok) throw new Error('sign-in refused');
      session = await minted.json();
    }
    const H = () => ({
      'Content-Type':'application/json',
      'X-ArchHub-CSRF':session.csrf,
      'X-ArchHub-Session':session.token,
    });
    const jget = async p => {
      const r = await fetch(p, {headers:H()});
      const d = await r.json();
      if (!r.ok || d.ok === false) {
        const error = new Error(d.error || 'read refused');
        error.status = r.status;
        throw error;
      }
      if (d.workshop_scope) window.ARCHHUB_EXISTING_WORKSHOP?.setCanvas(d.workshop_scope);
      return d;
    };
    const jpost = async (p, b) => {
      const r = await fetch(p, {method:'POST', headers:H(), body:JSON.stringify(b || {})});
      const d = await r.json();
      if (!r.ok || d.ok === false) {
        const error = new Error(d.error || 'refused');
        error.status = r.status;
        throw error;
      }
      try {
        if (d.workshop_scope) window.ARCHHUB_EXISTING_WORKSHOP?.setCanvas(d.workshop_scope);
      } catch (_) { d.projection_warning = 'Action accepted; refresh the canvas to update its Workshop scope.'; }
      return d;
    };
    window.ARCHHUB_AGENT = async (prompt, model, node) =>
      (await jpost('/api/universal/agent', {prompt, model,
        ...(node !== undefined ? {node} : {})})).answer || 'done';
    // The composer pick is the owner's graph-held setting
    // (configuration.composer_model), saved through the interaction route
    // the other owner settings use; '' clears it.
    window.ARCHHUB_AGENT_SELECT = async model => {
      const workshop = window.ARCHHUB_EXISTING_WORKSHOP;
      if (!workshop || typeof workshop.setComposerModel !== 'function') throw new Error('This connection cannot save a model selection.');
      return (await workshop.setComposerModel(model))?.configuration_state?.composer_model?.value;
    };
    let graphRunPromise = null;
    window.ARCHHUB_RUN = () => {
      if (graphRunPromise) return Promise.reject(new Error('The graph is already running. Wait for it to finish, then run again.'));
      graphRunPromise = jpost('/api/universal/run-graph', {}).then(result => {
        window.ARCHHUB_LAST_RUN = result;
        return result;
      }).finally(() => { graphRunPromise = null; });
      return graphRunPromise;
    };
    window.ARCHHUB_SET_PROP = (relation, value) =>
      jpost('/api/universal/set-property', {relation, value});
    window.ARCHHUB_GET_CANVAS = () => jget('/api/universal/canvas');
    window.ARCHHUB_GRAPH_CREATE = title => jpost('/api/universal/graph-create', {title});
    window.ARCHHUB_GRAPH_OPEN = root => jpost('/api/universal/graph-open', {root});
    window.ARCHHUB_SCOPE_OPEN = async targets => {
      const path = Array.isArray(targets) ? targets : [targets];
      if (!path.length || path.length > 32 || path.some(root => typeof root !== 'string' || !root) ||
          new Set(path).size !== path.length) throw new Error('The requested graph path is invalid.');
      let projection = await jget('/api/universal/canvas');
      const enter = async root => {
        const matches = (projection.interaction_projection?.bindings || []).filter(row => row.control === root);
        if (matches.length !== 1) throw new Error('This graph scope is not available to open.');
        const binding = matches[0];
        await jpost('/api/universal/interaction', {interaction:binding.interaction, control:root,
          event:binding.event, revision:projection.revision});
        projection = await jget('/api/universal/canvas');
      };
      if (projection.scope?.current === path[path.length - 1]) return projection;
      const root = projection.scope?.trail?.[0]?.root;
      if (!root) throw new Error('The current graph path is unavailable.');
      if (projection.scope.current !== root) await enter(root);
      for (const target of path) {
        if (projection.scope.current === target) continue;
        if (!(projection.nodes || []).some(row => row.id === target && row.openable === true))
          throw new Error('The requested scope is outside this view.');
        await enter(target);
      }
      return projection;
    };
    // The first edit of a connection parameter the wire has never held
    // declares it on the wire's own root; after that it is an ordinary
    // property and set-property carries it.
    window.ARCHHUB_SET_WIRE_PROP = (wire, label, value) =>
      jpost('/api/universal/wire-property', {wire, label, value});
    window.ARCHHUB_PICK_FILE = async (title, filter) =>
      (await jpost('/api/universal/pick-file', {title, filter})).path || '';
    window.ARCHHUB_CAPABILITIES = async () => {
      const scan = await jget('/api/universal/capabilities');
      return {
        ok: !!scan.ok, revision: scan.revision,
        present: (scan.capabilities || []).filter(c => c.present).length,
        total: (scan.capabilities || []).length,
        missing: scan.missing || [],
      };
    };
    window.ARCHHUB_REMEMBER = text =>
      jpost('/api/universal/brain-remember', {text});
    window.ARCHHUB_BRAIN_EXPORT = async () =>
      (await jpost('/api/universal/brain-export', {limit: 100000})).facts || [];
    window.ARCHHUB_BRAIN_FORGET = id =>
      jpost('/api/universal/brain-forget', {id});
    window.ARCHHUB_BRAIN_EDIT = (id, text) =>
      jpost('/api/universal/brain-edit', {id, text});
    window.ARCHHUB_NODE_CREATE = spec =>
      jpost('/api/universal/node-create', spec);
    window.ARCHHUB_RETRACT = root =>
      jpost('/api/universal/retract', {root});
    window.ARCHHUB_REVEAL = what =>
      jpost('/api/universal/reveal', {what});
    window.ARCHHUB_LOGIN = email =>
      jpost('/api/universal/login', {email});
    // Cloud sign-in: the app opens the browser on the cloud's own sign-in and
    // holds a loopback for the one-time code; the studio only polls.
    window.ARCHHUB_CLOUD_SESSION = async () => {
      const r = await fetch('/api/universal/cloud-session', {headers: H()});
      return r.json();
    };
    window.ARCHHUB_CLOUD_SIGNIN = method =>
      jpost('/api/universal/cloud-signin', {method});
    window.ARCHHUB_CLOUD_SIGNIN_STATUS = async () => {
      const r = await fetch('/api/universal/cloud-signin', {headers: H()});
      return r.json();
    };
    window.ARCHHUB_CLOUD_SIGNOUT = () =>
      jpost('/api/universal/cloud-signout', {});
    // The cockpit opens on this session: a one-time link the app mints.
    // Read as JSON either way: a refusal carries the state to show.
    window.ARCHHUB_COCKPIT_LINK = async () => {
      const r = await fetch('/api/universal/cockpit-link',
        {method:'POST', headers:H(), body:'{}'});
      return r.json();
    };
    window.ARCHHUB_ACCOUNTS = async () =>
      (await jpost('/api/universal/accounts', {})).accounts || [];
    window.ARCHHUB_SET_TIER = (email, tier) =>
      jpost('/api/universal/account-tier', {email, tier});
    try {
      const held = JSON.parse(localStorage.getItem('archhub.account.v1') || '{}');
      if (held.email) {
        const live = await window.ARCHHUB_LOGIN(held.email);
        window.ARCHHUB_ACCOUNT = live;
        localStorage.setItem('archhub.account.v1', JSON.stringify(
          Object.assign(held, {plan: live.tier, graphTier: live.tier, founder: !!live.founder})));
      }
    } catch (e) {}
    const PARAM_SPECS = {
      threshold: {type:'slider', min:10, max:250, step:5,
        help:'Edge sensitivity — lower finds more lines'},
      min_length: {type:'slider', min:5, max:200, step:5,
        help:'Ignore segments shorter than this (px)'},
      max_gap: {type:'slider', min:1, max:40, step:1,
        help:'Bridge breaks up to this many px'},
      mm_per_pixel: {type:'number',
        help:'Scale — real millimetres per image pixel'},
      height_mm: {type:'slider', min:2000, max:6000, step:100,
        help:'Wall height in millimetres'},
      image_path: {type:'path', filter:'Images (*.png *.jpg *.jpeg *.bmp)',
        help:'The sketch image to read'},
      file_path: {type:'path', filter:'CAD (*.dxf)',
        help:'The DXF file to read'},
      layer: {type:'text', help:'Only this layer; empty = all'},
      level: {type:'text', help:'Revit level name to build on'},
      session: {type:'text', help:'Revit port to build into (e.g. 48884)'},
      prompt: {type:'text', help:'What to recall from the brain'},
    };
    const canvas = await jget('/api/universal/canvas');
    // Read the bound view's theme before tokens and dependent modules evaluate.
    window.ARCHHUB_THEME = canvas.configuration?.theme ?? null;
    // Release updates use this authenticated transport even on canvases without a Workshop.
    if (typeof window.ArchHubExistingWorkshop?.create !== 'function') {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = '/studio/studio-existing-workshop.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('Studio update and Workshop transport could not be loaded.'));
        document.head.appendChild(script);
      });
    }
    window.ARCHHUB_EXISTING_WORKSHOP = window.ArchHubExistingWorkshop.create({get:jget, post:jpost,
      projectCanvas:projectStudioCanvas});
    window.ARCHHUB_EXISTING_WORKSHOP.setThemeCanvas(canvas);
    if (canvas.workshop_scope) {
      window.ARCHHUB_EXISTING_WORKSHOP.setCanvas(canvas.workshop_scope);
    }
    let hosts = [], connectors = [];
    window.ARCHHUB_LOAD_HOSTS = async () => {
      const scan = await jget('/api/universal/hosts');
      // The server answers from its background probe; before the first probe
      // lands it says so, and the panel offers "read again" instead of "none".
      if (scan.probing) throw new Error('the host probe is still running');
      // Per operation: its real court, or the dependency that keeps it unavailable.
      window.ARCHHUB_HOST_OPERATIONS = Array.isArray(scan.operations) ? scan.operations : [];
      return {hosts:scan.hosts || [], connectors:scan.connectors || []};
    };
    // Settings > Hosts > Assistants: read every client's state; write one entry
    // only when the person presses Connect for it (consent is that press).
    window.ARCHHUB_ASSISTANTS = {
      read: () => jget('/api/universal/assistant-registration'),
      connect: client => jpost('/api/universal/assistant-registration', {client, consent:true}),
    };
    window.ARCHHUB_LOAD_MEMORY = async () => {
      // Read only when the Brain tab opens; the server gives the brain 4 s and
      // this page 6 s before the tab says the brain is not answering.
      const answer = await Promise.race([
        jpost('/api/universal/brain-export', {limit:500, quick:true}),
        new Promise((_, refuse) => setTimeout(() => refuse(new Error('Brain not answering')), 6000)),
      ]).catch(error => { throw new Error(/answer|503|silent/i.test(String(error && error.message)) ?
        'Brain not answering' : String((error && error.message) || error)); });
      const held = answer.facts || {};
      const out = [];
      for (const folder of (held.folders || [])) {
        for (const fact of (folder.facts || [])) {
          if (fact.archived) continue;
          out.push({id:String(fact.id), text:String(fact.desc || fact.name || fact.body || '').slice(0,240),
            src:String(folder.label || fact.kind || '')});
        }
      }
      return out;
    };
    window.ARCHHUB_LOAD_SKILLS = async () =>
      (await jpost('/api/universal/skills', {want:'catalogue'})).result || [];
    // One skill's own file text, for the Skill split view.
    window.ARCHHUB_READ_SKILL = async name =>
      String((await jpost('/api/universal/skills', {want:'read', skill:String(name || '')})).result || '');
    function projectStudioCanvas(canvas) {
    const CATS = e =>
      e.startsWith('vision.') || e.startsWith('cad.') ? 'read'
      : e.startsWith('lines.') ? 'annotate'
      : e.startsWith('revit.') ? 'host'
      : e.startsWith('brain.') ? 'ai'
      : e.startsWith('ai') ? 'ai' : 'logic';
    const PORT_TYPES = {
      'vision.sketch_lines': {in:'file', out:'lines'},
      'cad.read_lines': {in:'file', out:'lines'},
      'lines.watch': {in:'lines', out:'lines'},
      'revit.build_walls': {in:'lines', out:'walls'},
      'revit.sessions': {in:'any', out:'rows'},
      'brain.recall': {in:'text', out:'text'},
      'brain.facts': {in:'any', out:'rows'},
      'baboom.status': {in:'any', out:'rows'},
      'baboom.presence': {in:'any', out:'rows'},
    };
    const nodes = [];
    for (const n of (canvas.nodes || [])) {
      const params = Object.fromEntries((n.params || []).map(r => [r.label, r.value]));
      const engine = String(n.engine || params.engine || '');
      const types = PORT_TYPES[engine] || {in:'any', out:'any'};
      const ins = [], outs = [];
      for (const p of (n.ports || [])) {
        if (p.side === 'target') {
          ins.push({...p, label:p.name || '', t:p.value_type || types.in});
        } else if (p.side === 'source') {
          outs.push({...p, label:p.name || '', t:p.value_type || types.out});
        }
      }
      nodes.push({
        id:n.id, cat:CATS(engine), title:n.label || n.id, sub:engine || 'Graph node',
        x:Number.isFinite(n.x) ? n.x : 200, y:Number.isFinite(n.y) ? n.y : 200,
        w:210, h:Math.max(110, 54 + Math.max(ins.length, outs.length) * 19),
        ins, outs, messages:[], live:true,
        params:(n.params || [])
          .filter(r => r.label !== 'engine' && r.label !== 'status')
          .map(r => ({
            k:r.label, v:r.value, rel:r.relation,
            editable:r.editable !== false && !!r.relation, owner:n.id,
            ...(PARAM_SPECS[r.label] || {type:'text'}),
          })),
        ports:{ins:ins.map(x => ({id:x.id, t:x.t})),
               outs:outs.map(x => ({id:x.id, t:x.t}))},
        status: n.status || params.status || '',
      });
    }
    const nodeIndex = new Map(nodes.map(node => [node.id, node]));
    const wires = [];
    for (const w of (canvas.wires || [])) {
      const sourcePort = nodeIndex.get(w.source)?.outs.find(port => port.id === w.source_interface);
      // A wire is a node: it brings its own governed parameters across,
      // in the same {k, v, rel} shape a node's carry, so the inspector
      // writes a connection's condition back to the graph exactly as it
      // writes a node's.
      // Keep missing interfaces missing; the renderer reports them instead of inventing a first port.
      wires.push({...w, id:String(w.id || ''), from:[w.source, w.source_interface],
        to:[w.target, w.target_interface], t:sourcePort?.t || '',
        params:(w.params || []).map(r => ({k:r.label, v:r.value, rel:r.relation}))});
    }
    return {nodes, wires};
    }
    window.ARCHHUB_EXISTING_WORKSHOP.setTopologyCanvas(canvas);
    const {nodes, wires} = window.ARCHHUB_EXISTING_WORKSHOP.getSnapshot().topology.graph;
    const graphIndex = await jget('/api/universal/graphs');
    window.ARCHHUB_LIVE = {
      sessions: graphIndex.graphs,
      currentGraph: graphIndex.current_graph,
      hosts, connectors, graph:{nodes, wires},
      // Optional catalogues load when their panels open, never before Studio.
      memory:[], skills:[],
    };
    await mountStudio();
  } catch (error) {
    fail(error?.message || String(error));
  }
})();
</script>
</body>
</html>
